<style>

/* barra con la insignia (opción C) */

}

<script>
/* ═══ utilidades ═══ */
/* en clientes.ecovsaapp.com los documentos (recibo, certificados) se abren desde ecovsaapp.com */
var DOCS = /^clientes\./.test(location.hostname) ? 'https://ecovsaapp.com/' : '';
function doc(u){ return /^https?:/.test(u||'') ? u : DOCS + (u||''); }
var S = null, SES = '', V = 'inicio', PIN = '', PIN1 = '', ESTADO = '', INV = '', CLI = '', COD = '', HOJA_YA = false, RECIEN = false;
var MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'], MESL = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var EMB = 'ecovsa-emblema.png';
function $(i){ return document.getElementById(i); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function q(k){ var m=(location.search||'').match(new RegExp('[?&]'+k+'=([^&]+)')); return m?decodeURIComponent(m[1]):''; }
function f(i){ var d=new Date(String(i)+'T12:00:00'); return isNaN(d)?String(i||''):d.getDate()+' '+MES[d.getMonth()]+' '+d.getFullYear(); }
function fl(i){ var d=new Date(String(i)+'T12:00:00'); return isNaN(d)?String(i||''):d.getDate()+' de '+MESL[d.getMonth()]+' de '+d.getFullYear(); }
function mesDe(i){ var d=new Date(String(i)+'T12:00:00'); if(isNaN(d)) return ''; var m=MESL[d.getMonth()]; return m.charAt(0).toUpperCase()+m.slice(1)+' '+d.getFullYear(); }
function kg(v){ return (Math.round((Number(v)||0)*100)/100).toLocaleString('es-PA'); }
function B(v){ return 'B/. '+(Number(v)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
/* el número de Sage se guarda y se envía completo; al cliente solo se le quitan los ceros de la izquierda */
function nFac(n){ return String(n==null?'':n).replace(/^0+(?=\d)/,''); }
function toast(t){ var a=$('toast'); a.textContent=t; a.style.display='block'; clearTimeout(a._t); a._t=setTimeout(function(){ a.style.display='none'; },4000); }
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k)||''; if(v) localStorage.setItem(k,v); else localStorage.removeItem(k); }catch(e){ return ''; } }
function llamar(fn){ var a=[].slice.call(arguments,1); return new Promise(function(ok,no){ var r=google.script.run.withSuccessHandler(ok).withFailureHandler(no); r[fn].apply(r,a); }); }
function logo(px,arma){ return window.ECOCARGA?ECOCARGA.logo(px||76,{arma:!!arma}):'<img src="logo-ecovsa.png" alt="ECOVSA" style="width:'+(px||76)+'px">'; }
function cerrarModal(){ var m=$('fondo'); if(m) m.remove(); }
function modal(h){ cerrarModal(); var d=document.createElement('div'); d.className='fondo'; d.id='fondo'; d.innerHTML='<div class="modal" role="dialog" aria-modal="true">'+h+'</div>'; d.onclick=function(e){ if(e.target===d) cerrarModal(); }; document.body.appendChild(d); }
function ocupado(b,si,t){ if(!b) return; if(si){ b._t=b.innerHTML; b.disabled=true; b.textContent=t||'Enviando…'; } else { b.disabled=false; if(b._t) b.innerHTML=b._t; } }
function chips(id,ops,sel){ return '<div class="ll-chips" id="'+id+'" role="radiogroup">'+ops.map(function(o){ return '<button type="button" role="radio" data-c="'+o[0]+'" class="'+(o[0]===sel?'on':'')+'" aria-checked="'+(o[0]===sel)+'">'+o[1]+'</button>'; }).join('')+'</div>'; }
function chipsActivar(id){ var c=$(id); if(!c) return; c.onclick=function(e){ var b=e.target.closest('button[data-c]'); if(!b) return; c.querySelectorAll('button').forEach(function(x){ x.classList.remove('on'); x.setAttribute('aria-checked','false'); }); b.classList.add('on'); b.setAttribute('aria-checked','true'); }; }
function chipSel(id){ var b=$(id)&&$(id).querySelector('button.on'); return b?b.getAttribute('data-c'):''; }

/* íconos de línea */
var ICP = {
  casa:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',

  cert:'<rect x="4" y="3" width="16" height="13" rx="2"/><circle cx="12" cy="17" r="3"/><path d="M10.5 19.5L10 22l2-1 2 1-.5-2.5"/><path d="M8 7h8M8 10h5"/>',

  lista:'<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>',
  salir:'<path d="M15 4h4v16h-4"/><path d="M10 8l-4 4 4 4M6 12h10"/>',
  descarga:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  der:'<path d="M9 6l6 6-6 6"/>',
  basura:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  instalar:'<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M12 7v7M9 11l3 3 3-3"/>',
  ok:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  flechaIzq:'<path d="M15 6l-6 6 6 6"/>',
  chat:'<path d="M4 5h16v11H9l-5 4z"/>',
  sedes:'<path d="M3 21V8l6-4 6 4v13"/><path d="M15 21V11h6v10M7 10h4M7 14h4M7 18h4"/>',
  equipo:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.2c3 .2 5.5 2.4 5.5 5.8"/>'
};
function ic(n,s){ s=s||18; return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICP[n]||'')+'</svg>'; }
function emC(px,ins){ return '<span class="em-c'+(ins?' ins':'')+'"'+(ins?'':' style="width:'+px+'px;height:'+px+'px"')+'><img src="'+EMB+'" alt="ECOVSA"></span>'; }
function icono(px){ return '<span class="ico iA" style="width:'+px+'px;height:'+px+'px;border-radius:'+Math.round(px*.225)+'px"><span class="c"><img src="'+EMB+'" alt=""></span></span>'; }
/* dibujos de los productos (fotos sin fondo) */
var IMG = { bolsas:'ptl-bolsas.png', punzo:'ptl-punzo.png', pedal:'ptl-pedal.png', fumiga:'ptl-fumiga.png', solidos:'ptl-solidos.png', lleno:'ptl-lleno.png' };
function ilu(k,alt){ return '<img src="'+IMG[k]+'" alt="'+esc(alt||'')+'" loading="lazy">'; }

/* ═══ entrada ═══ */
function pantallaPin(titulo, sub, extra){
  $('app').innerHTML='<div class="ent"><div class="card">'+logo(76,true)+'<h2>'+titulo+'</h2><p style="color:var(--gris);margin:0">'+sub+'</p><div class="pts" id="pts"></div>'+
    '<div class="tec" id="tec">'+['1','2','3','4','5','6','7','8','9','','0','⌫'].map(function(x){ return x===''?'<span></span>':'<button type="button" data-k="'+x+'" aria-label="'+(x==='⌫'?'Borrar':x)+'">'+x+'</button>'; }).join('')+'</div>'+
    '<div class="msg" id="msg"></div>'+(extra||'')+'</div></div>';
  PIN=''; pts();
  $('tec').onclick=function(e){ var b=e.target.closest('button'); if(!b) return; var k=b.getAttribute('data-k'); if(k==='⌫') PIN=PIN.slice(0,-1); else if(PIN.length<6) PIN+=k; pts(); if(PIN.length===6) setTimeout(alPin,120); };
}
document.addEventListener('keydown',function(e){ if(!$('tec')) return; if(/^\d$/.test(e.key)&&PIN.length<6){ PIN+=e.key; pts(); if(PIN.length===6) setTimeout(alPin,120); } else if(e.key==='Backspace'){ PIN=PIN.slice(0,-1); pts(); } });
function pts(){ var p=$('pts'); if(p){ var h=''; for(var i=0;i<6;i++) h+='<i class="'+(i<PIN.length?'on':'')+'"></i>'; p.innerHTML=h; } }
var alPin=function(){};
function entrar(){
  ESTADO='entrar';
  pantallaPin('Entrar a su portal','Escriba su PIN de 6 números.',
    '<p style="margin:16px 0 0;font-size:13.5px">'+(CLI?'<a href="?cli='+encodeURIComponent(CLI)+'&cod='+encodeURIComponent(COD)+'&p=activar">¿Primera vez? Activar mi acceso</a> · <a href="?cli='+encodeURIComponent(CLI)+'&cod='+encodeURIComponent(COD)+'&p=olvide">Olvidé mi PIN</a>':'¿Primera vez u olvidó su PIN? Escanee el QR del distintivo de su establecimiento o escríbanos al WhatsApp <b>6264-1647</b>.')+'</p>');
  alPin=function(){ var m=$('msg'); m.style.color='var(--gris)'; m.textContent='Revisando…';
    llamar('api_ptlEntrar',PIN).then(function(r){ if(!r||!r.ok){ m.style.color=''; m.textContent=(r&&r.error)||'No se pudo entrar.'; PIN=''; pts(); return; } SES=r.sesion; ls('ptl_ses',SES); cargar(); },
      function(){ m.style.color=''; m.textContent='Sin conexión. Intente de nuevo.'; PIN=''; pts(); }); };
}
function invitacion(){
  llamar('api_ptlInvitacion',INV).then(function(r){
    if(!r||!r.ok){ $('app').innerHTML='<div class="ent"><div class="card">'+logo(76)+'<h2>Invitación no válida</h2><p style="color:var(--gris)">'+esc((r&&r.error)||'')+'</p><a class="btn pri" href="Portal.html">Entrar con mi PIN</a></div></div>'; return; }
    var de=r.nivel==='corp'?'<b>'+esc(r.de)+'</b> (todas las sedes)':'<b>'+esc(r.de)+'</b>';
    var crear=function(){ pantallaPin('Bienvenido, '+esc(String(r.nombre).split(' ')[0]),'ECOVSA le invita a su portal de '+de+'.<br><b style="color:var(--tinta)">Cree su PIN de 6 números.</b>','<p class="pista" style="margin-top:14px">No use su fecha de nacimiento ni números seguidos. Es solo suyo: no lo comparta.</p>');
      alPin=function(){ PIN1=PIN; pantallaPin('Repita su PIN','Escríbalo otra vez para confirmarlo.'); alPin=function(){
        var m=$('msg'); m.style.color='var(--gris)'; m.textContent='Guardando…';
        llamar('api_ptlCrearPin',INV,PIN1,PIN).then(function(x){ if(!x||!x.ok){ toast((x&&x.error)||'No se pudo'); crear(); setTimeout(function(){ var mm=$('msg'); if(mm) mm.textContent=(x&&x.error)||''; },50); return; }
          /* 3.18: en vez de la pantalla «Tenga ECOVSA en su celular», entra al portal y sale la hoja para instalar */
          SES=x.sesion; ls('ptl_ses',SES); history.replaceState(null,'','Portal.html'); RECIEN=true; toast('✓ PIN creado'); cargar(); }, function(){ m.style.color=''; m.textContent='Sin conexión. Intente de nuevo.'; }); }; }; };
    crear();
  },function(){ toast('Sin conexión'); });
}
function pedirAcceso(tipo){
  var olv=tipo==='olvide';
  $('app').innerHTML='<div class="ent"><div class="card" style="text-align:left">'+'<div style="text-align:center">'+logo(70,true)+'</div><h2 style="text-align:center">'+(olv?'Olvidé mi PIN':'Activar mi acceso')+'</h2>'+
    '<p style="color:var(--gris);margin:0 0 14px;text-align:center">'+(olv?'Pida un PIN nuevo. ':'Pida su acceso al portal de este establecimiento. ')+'Por seguridad, ECOVSA le manda la invitación al WhatsApp registrado del establecimiento.</p>'+
    '<div class="campo"><label for="pa-n">Su nombre</label><input id="pa-n" autocomplete="name"></div><div class="campo"><label for="pa-c">Su cargo</label><input id="pa-c" placeholder="Ej. Administradora"></div>'+
    '<div class="campo"><label for="pa-o">Nota (opcional)</label><input id="pa-o"></div><button class="btn pri" style="width:100%" id="pa-b" type="button">Enviar el pedido</button><div class="msg" id="msg"></div>'+
    '<p style="text-align:center;margin:14px 0 0;font-size:13.5px"><a href="Portal.html'+(CLI?'?cli='+encodeURIComponent(CLI)+'&cod='+encodeURIComponent(COD):'')+'">Ya tengo mi PIN</a></p></div></div>';
  $('pa-b').onclick=function(){ var b=this; ocupado(b,true);
    llamar('api_ptlPedirAcceso',CLI,COD,{tipo:olv?'olvide':'activar',nombre:$('pa-n').value,cargo:$('pa-c').value,nota:$('pa-o').value}).then(function(r){ ocupado(b,false);
      if(!r||!r.ok){ $('msg').textContent=(r&&r.error)||'No se pudo'; return; }
      $('app').innerHTML='<div class="ent"><div class="card">'+logo(70)+'<h2>Pedido recibido</h2><p style="color:var(--gris)">'+esc(r.mensaje||'')+'</p>'+(r.folio?'<span class="tag t-info">'+esc(r.folio)+'</span>':'')+'</div></div>'; },
      function(){ ocupado(b,false); $('msg').textContent='Sin conexión. Intente de nuevo.'; }); };
}

/* ═══ instalar en el celular (hoja de abajo, opción B) ═══ */
var EV_INST=null; window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); EV_INST=e; });
function instalada(){ try{ return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true; }catch(e){ return false; } }
function esCel(){ try{ return matchMedia('(max-width: 820px)').matches||/android|iphone|ipad|ipod/i.test(navigator.userAgent); }catch(e){ return false; } }
function tocaHoja(){
  if(HOJA_YA||instalada()||!esCel()) return false;
  if(RECIEN) return true;
  var no=Number(ls('ptl_ins_no'))||0; return Date.now()-no>7*864e5;
}
function hojaIns(){
  HOJA_YA=true;
  var nom=nivel()==='corp'?S.yo.razonSocial:(S.sedes[0]||{}).nombre, pago=nivel()!=='sede';

/* ── api 3.37 · Seguimiento de la visita, ENCENDIDO (maqueta aprobada por Álvaro el 22 oct, todas las recomendadas) ──
   · El día de su recolección: en qué va la ruta, cuántas paradas faltan y la llegada estimada en un rango de 20 minutos.
   · El vehículo se ve en el mapa SOLO cuando su local es la siguiente parada (nunca se ven otros clientes).
   · Se actualiza solo cada minuto mientras la pantalla está abierta. */
var SG={ v:null, t:0, cargando:false, mapa:null, hoy:'' };
function sgCargar(forzar){
  if(!S||!SES||nivel()==='corp'||SG.cargando) return;
  if(!forzar&&Date.now()-SG.t<55000) return;
  SG.cargando=true;
  llamar('api_ptlSeguimiento',SES).then(function(r){
    SG.cargando=false; SG.t=Date.now();
    if(!r||!r.ok) return;
    var antes=JSON.stringify(SG.v); SG.v=r.visita||null; SG.hoy=r.hoy||'';
    if(antes!==JSON.stringify(SG.v)&&(V==='inicio'||V==='seguimiento')) pintar();
  },function(){ SG.cargando=false; });
}
window.sgActualizar=function(){ sgCargar(true); };
setInterval(function(){ if(document.visibilityState==='visible'&&(V==='inicio'||V==='seguimiento')) sgCargar(); },20000);
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'&&(V==='inicio'||V==='seguimiento')) sgCargar(); });
/* «18:40» → «6:40 p. m.» */
function h12(t){ var m=/^(\d{1,2}):(\d{2})/.exec(String(t||'')); if(!m) return String(t||''); var h=Number(m[1]); return (h%12||12)+':'+m[2]+' '+(h<12?'a. m.':'p. m.'); }
function sgRango(v){ return v&&v.rango?h12(v.rango.desde)+' – '+h12(v.rango.hasta):''; }
function sgHace(s){ return s==null?'':s<60?'hace '+s+' s':'hace '+Math.round(s/60)+' min'; }
function sgDia(){ var d=new Date((SG.hoy||S.hoy)+'T12:00:00'); return ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'][d.getDay()]+' '+d.getDate()+' de '+MESL[d.getMonth()]; }

  return '<div class="corp-sites corp-listwrap"><table class="corp-list"><thead><tr><th>Sede / encargado</th><th>Frecuencia</th><th>Visitas del mes</th><th>Última recolección</th><th>Próxima estimada</th><th>Acciones</th></tr></thead><tbody>'+L.map(function(s){

    return '<tr><td><b>'+esc(s.nombre)+'</b><small>'+esc(s.direccion)+'</small><small>'+esc(tm.length?tm.map(function(x){ return x.nombre; }).join(', '):'Sin encargado con acceso')+'</small></td><td>'+esc(cap(s.frecuencia)||'—')+'</td>'+
      '<td><strong class="corp-listcount">'+p.done+' de '+(p.total||'—')+'</strong><small>'+(!p.total?'Cantidad por confirmar':p.remaining?p.remaining+' pendiente'+(p.remaining===1?'':'s'):'Completadas')+'</small>'+(p.total?'<div class="pb '+(p.remaining?'warn':'')+'"><i style="width:'+p.percent+'%"></i></div>':'')+'</td>'+
      '<td>'+(s.ultimaVisita?f(s.ultimaVisita):'Aún sin visitas')+'</td><td>'+(nx?f(nx):'Por coordinar')+'<small>Fecha tentativa</small></td><td><div class="r-act">'+accion('Ver detalle',"corpOpen('"+esc(s.clienteId)+"')",'sm')+(!tm.length?accion('Asignar encargado',"corpAccess('"+esc(s.clienteId)+"')",'sm'):'')+'</div></td></tr>'; }).join('')+'</tbody></table></div>';
}
function inicioCorp(){
  var h=P0.inicio(); if(S.cuenta.estado==='suspendida') return h;
  h=h.replace('Visitas de esta semana','Próximas visitas estimadas').replace('No hay visitas programadas esta semana.','No hay visitas estimadas para los próximos siete días.');
  var nd=S.sedes.filter(corpNeeds);
  var b='<section class="card corp-overview"><div><div class="r-eyebrow">Administración corporativa</div><h2>Todas sus sedes, bajo control</h2><p>Supervise las recolecciones y gestione quién entra al portal de cada sucursal.</p></div><div class="r-act">'+accion('Ver todas las sedes',"ir('sedes')",'pri')+accion('Gestionar accesos',"ir('equipo')")+'</div></section>'+
    '<div class="cal-shortcut">'+accion('Ver calendario de recolecciones',"ir('calendario')",'sm')+'<span>Consulte las fechas y la distribución de visitas del mes.</span></div>'+corpMonthSummary()+
    '<section class="card corp-attention"><h3>'+(nd.length?'Necesita su atención':'Sin pendientes por sede')+'<span class="sp"></span><span class="tag '+(nd.length?'t-warn':'t-ok')+'">'+nd.length+' sede'+(nd.length===1?'':'s')+'</span></h3>'+
    (nd.length?nd.map(function(s){ var sin=!corpTeam(s).length, r=sin?'No tiene encargado con acceso':!corpNext(s)?'Primera visita por coordinar':corpNext(s)<S.hoy?'Revisar fecha de recolección':'Aviso de depósito lleno · En coordinación';
      return '<div class="fila"><div class="tx"><b>'+esc(s.nombre)+'</b><small>'+r+'</small></div>'+accion(sin?'Asignar encargado':'Ver sede',sin?"corpAccess('"+esc(s.clienteId)+"')":"corpOpen('"+esc(s.clienteId)+"')",'sm')+'</div>'; }).join(''):'<p class="corp-address">Todas las sedes tienen encargado y fecha de recolección disponible.</p>')+'</section>';
  var i=h.indexOf('<div class="grid g4">'); return i<0?b+h:h.slice(0,i)+b+h.slice(i);
}
window.vSedes=function(){
  if(nivel()!=='corp') return P0.sedes();
  if(CORP.site){ var s=S.sedes.find(function(x){ return x.clienteId===CORP.site; });
    if(s) return accion('‹ Volver a todas las sedes',"corpOpen('')",'sm')+titulo(esc(s.nombre),'Supervisión corporativa de la sucursal')+corpCard(s)+
      '<div class="grid g2" style="margin-top:16px"><section class="card"><h3>Recibos de esta sede</h3>'+(S.recibos.filter(function(r){ return r.sede===s.nombre; }).slice(0,8).map(filaRec).join('')||'<p style="color:var(--gris);margin:0">Todavía no hay visitas registradas.</p>')+'</section>'+
      '<section class="card"><h3>Coordinar con ECOVSA</h3><p style="color:var(--gris)">Solicite una visita para esta sede. ECOVSA confirmará la fecha.</p>'+accion('Solicitar visita',"solicitar('Programar visita','Desechos peligrosos','"+esc(s.clienteId)+"')",'pri')+'</section></div>'; }
  var L=S.sedes.filter(function(s){ return s.nombre.toLowerCase().indexOf(CORP.query.toLowerCase())>=0&&(CORP.filter==='todas'||(CORP.filter==='atencion'&&corpNeeds(s))||(CORP.filter==='sinacceso'&&!corpTeam(s).length)); });
  return titulo('Sus sedes','Frecuencia, avance del mes y fechas de recolección de cada sucursal.')+corpMonthSummary()+
    '<div class="corp-toolbar"><label for="corp-search">Buscar sede<input id="corp-search" placeholder="Nombre de la sede" value="'+esc(CORP.query)+'"></label><label for="corp-filter">Mostrar<select id="corp-filter"><option value="todas"'+(CORP.filter==='todas'?' selected':'')+'>Todas las sedes</option><option value="atencion"'+(CORP.filter==='atencion'?' selected':'')+'>Necesitan atención</option><option value="sinacceso"'+(CORP.filter==='sinacceso'?' selected':'')+'>Sin encargado con acceso</option></select></label><span role="status">'+L.length+' de '+S.sedes.length+' sedes</span></div>'+
    (L.length?corpSiteList(L):'<div class="corp-sites">'+vacio('No encontramos sedes','Pruebe otro nombre o cambie el filtro.')+'</div>');
};
window.vEquipo=function(){
  var h=P0.equipo(); if(nivel()!=='corp') return h;
  var i=h.indexOf('<div style="margin-bottom:12px">'), nota='<div class="card corp-accessnote"><h3>Un acceso para cada responsabilidad</h3><div class="grid g2"><div><b>Corporativo</b><p>Supervisa todas las sedes, la cuenta y los accesos del equipo.</p></div><div><b>Encargado de sucursal</b><p>Ve el portal de una sola sede, con sus visitas, documentos y solicitudes.</p></div></div><small>Usted pide los accesos y las bajas; ECOVSA los aprueba.</small></div>';
  return i<0?h+nota:h.slice(0,i)+nota+h.slice(i);
};
window.pedirPersona=function(){ P0.pedirPersona(); var s=$('pp-s'); if(s&&CORP.accessSite) s.value=CORP.accessSite; CORP.accessSite=''; };

/* ── Calendario de recolecciones (corporativo): realizadas = recibos; estimadas = según frecuencia ── */
function calEvents(){
  var ym=S.hoy.slice(0,7), y=Number(ym.slice(0,4)), mo=Number(ym.slice(5,7))-1, ult=new Date(y,mo+1,0).getDate(), ev=[];
  var iso=function(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
  S.sedes.forEach(function(s){
    var R=S.recibos.filter(function(r){ return r.sede===s.nombre&&r.fecha.slice(0,7)===ym; });
    R.forEach(function(r){ ev.push({ site:s.clienteId, name:s.nombre, date:r.fecha, status:'realizada', kg:r.kg }); });
    if(s.estado!=='activo') return;
    var nx=corpNext(s); if(!nx) return;
    var dias=Number(s.lleno&&s.lleno.dias)||0, F=[];
    if(dias>0&&dias<=31){
      var a=new Date(nx+'T12:00:00'), ini=new Date(y,mo,1,12), fin=new Date(y,mo,ult,12), d=new Date(a);
      while(d>ini) d.setDate(d.getDate()-dias);
      for(;d<=fin;d.setDate(d.getDate()+dias)) if(d>=ini) F.push(iso(d));
    } else if(nx.slice(0,7)===ym) F.push(nx);
    var tol=Math.min(3,Math.floor((dias||30)/2));
    F.forEach(function(fe){
      var hecho=R.some(function(r){ return Math.abs((new Date(r.fecha+'T12:00:00')-new Date(fe+'T12:00:00'))/864e5)<=tol; });
      if(!hecho) ev.push({ site:s.clienteId, name:s.nombre, date:fe, status:fe<S.hoy?'sinregistro':'estimada' });
    });
  });
  return ev.sort(function(a,b){ return a.date.localeCompare(b.date)||a.name.localeCompare(b.name); });
}
function calStatus(e){ return e.status==='realizada'?'Realizada':e.status==='sinregistro'?'Estimada · sin registro':'Estimada'; }
function calView(){
  var ev=calEvents().filter(function(e){ return !CAL.site||e.site===CAL.site; }), ym=S.hoy.slice(0,7), pri=new Date(ym+'-01T12:00:00'), off=(pri.getDay()+6)%7, dias=new Date(pri.getFullYear(),pri.getMonth()+1,0).getDate(), c='';
  for(var b=0;b<off;b++) c+='<div class="cal-day cal-blank" aria-hidden="true"></div>';
  for(var d=1;d<=dias;d++){ var fe=ym+'-'+String(d).padStart(2,'0'), it=ev.filter(function(e){ return e.date===fe; });
    c+='<div class="cal-day'+(fe===S.hoy?' cal-today':'')+'"><div class="cal-daytop"><time datetime="'+fe+'">'+d+'</time>'+(it.length?'<span>'+it.length+' visita'+(it.length===1?'':'s')+'</span>':'')+'</div>'+it.map(function(e){ return '<button type="button" class="cal-event '+e.status+'" onclick="corpOpen(\''+esc(e.site)+'\')"><b>'+esc(e.name)+'</b><small>'+calStatus(e)+(e.status==='realizada'?' · '+kg(e.kg)+' kg':'')+'</small></button>'; }).join('')+'</div>'; }
  for(var n=dias;(off+n)%7;n++) c+='<div class="cal-day cal-blank" aria-hidden="true"></div>';
  var re=ev.filter(function(e){ return e.status==='realizada'; }).length, es=ev.filter(function(e){ return e.status==='estimada'; }).length, sr=ev.length-re-es;
  return '<section class="card cal-section"><div class="cal-header"><div><div class="r-eyebrow">Calendario mensual de recolección</div><h2>'+esc(cap(corpMonth()))+'</h2><p>Qué sede se atiende, qué día y cuántas visitas se contemplan este mes.</p></div><label for="cal-site">Ver sede<select id="cal-site"><option value="">Todas las sedes</option>'+S.sedes.map(function(s){ return '<option value="'+esc(s.clienteId)+'"'+(CAL.site===s.clienteId?' selected':'')+'>'+esc(s.nombre)+'</option>'; }).join('')+'</select></label></div>'+
    '<div class="cal-totals"><b>'+ev.length+' visita'+(ev.length===1?'':'s')+' en el calendario</b><span>'+re+' realizadas</span><span>'+es+' estimadas por venir</span><span>'+sr+' estimadas pasadas sin registro</span></div><div class="cal-legend"><span class="realizada">● Realizada</span><span class="estimada">● Estimada</span><span class="sinregistro">● Estimada pasada sin registro</span></div>'+
    '<p class="cal-disclaimer">Las fechas estimadas son tentativas según la frecuencia y la última visita; no confirman programación. Una fecha pasada sin registro requiere revisión y no acredita una recolección.</p>'+
    '<div class="cal-scroll"><div class="cal-week">'+['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(function(x){ return '<span>'+x+'</span>'; }).join('')+'</div><div class="cal-grid">'+c+'</div></div>'+
    '<h3 class="cal-tabletitle">Fechas y cantidad de visitas por sede</h3><div class="cal-tablewrap"><table class="cal-table"><thead><tr><th>Sede / frecuencia</th><th>Fechas del mes</th><th>Cantidad</th></tr></thead><tbody>'+S.sedes.filter(function(s){ return !CAL.site||s.clienteId===CAL.site; }).map(function(s){ var R=ev.filter(function(e){ return e.site===s.clienteId; });
      return '<tr><td><b>'+esc(s.nombre)+'</b><small>'+esc(cap(s.frecuencia)||'—')+'</small></td><td>'+(R.length?R.map(function(e){ return '<span class="cal-date '+e.status+'">'+f(e.date)+' · '+calStatus(e)+'</span>'; }).join(''):'<small>Sin fechas este mes</small>')+'</td><td><b>'+R.length+' visita'+(R.length===1?'':'s')+'</b><small>'+R.filter(function(e){ return e.status==='realizada'; }).length+' realizadas</small></td></tr>'; }).join('')+'</tbody></table></div></section>';
}

/* ── api 3.36 · Fumigación: la próxima fecha y «Agendar mi fumigación» si la tiene en su plan; si no, «Cotizar» (Mercadeo) ── */
window.FUM_ITEM='Fumigación y control de plagas';
function tieneFum(){ return S.sedes.some(function(x){ return !!x.fum; }); }
function fumAbierta(id){ return S.pedidos.find(function(p){ return !p.cerrada&&/fumig/i.test((p.item||'')+' '+(p.resumen||''))&&(!id||!p.clienteId||String(p.clienteId)===String(id)); }); }
function fumCard(s){
  var F=s&&s.fum; if(!F) return '';
  var pid="solicitar('Programar visita',FUM_ITEM"+(nivel()==='corp'?",'"+esc(s.clienteId)+"'":'')+")";
  if(F.proxima){ var d=new Date(F.proxima.fecha+'T12:00:00');
    return '<section class="card r-next fum"><div class="r-date"><b>'+d.getDate()+'</b><span>'+MES[d.getMonth()]+'</span></div><div class="r-title"><div class="r-eyebrow">Su próxima fumigación</div><h2>'+(F.proxima.fecha===S.hoy?'Hoy':fl(F.proxima.fecha))+', a las '+esc(F.proxima.hora)+'</h2><small>Fumigación y control de plagas · '+esc(String(F.frec||'').toLowerCase())+'</small><small>Fecha confirmada por logística.</small></div><div class="r-act">'+accion('Pedir otra fecha',"solicitar('Cambio de fecha',FUM_ITEM"+(nivel()==='corp'?",'"+esc(s.clienteId)+"'":'')+")")+'</div></section>'; }
  var ab=fumAbierta(s.clienteId);
  if(F.toca) return '<div class="r-alert fum">'+ilu('fumiga')+'<div class="tx"><b>'+(ab?'Ya recibimos su pedido de fumigación':'Le toca su fumigación')+'</b><small>'+(ab?'Solicitud '+esc(ab.folio)+'. Logística le confirma la fecha por aquí.':(F.ultima?'La última fue el '+f(F.ultima)+' · ':'')+esc(F.frec||'')+'. Elija el día que le conviene y logística se lo confirma.')+'</small></div>'+accion(ab?'Ver mi solicitud':'Agendar mi fumigación',ab?"ir('solicitudes')":pid,'sm pri')+'</div>';
  return '<div class="r-alert fum ok">'+ilu('fumiga')+'<div class="tx"><b>Fumigación al día</b><small>'+(F.ultima?'Última el '+f(F.ultima)+' · ':'')+esc(F.frec||'')+'</small></div>'+accion('Agendar mi fumigación',pid,'sm')+'</div>';
}
window.vInicio=(function(o){ return function(){
  var h=o(); if(nivel()==='corp'||!S.sedes[0]||!S.sedes[0].fum) return h;
  var c=fumCard(S.sedes[0]), i=h.indexOf('<div class="grid g3 r-metrics">');
  var k=h.indexOf('<div class="r-alert">'); if(k>=0&&k<i) i=k;
  return i<0?h+c:h.slice(0,i)+c+h.slice(i);
}; })(window.vInicio);
window.vServicios=(function(o){ return function(){
  var h=o(), si=tieneFum();
  return h.replace('onclick="pedir(\''+FUM_ITEM+'\')">Solicitar<','onclick="pedir(\''+FUM_ITEM+'\')">'+(si?'Agendar mi fumigación':'Cotizar')+'<');
}; })(window.vServicios);
window.pedir=(function(o){ return function(nom){ if(/fumig/i.test(nom||'')) return solicitar(tieneFum()?'Programar visita':'Cotización',FUM_ITEM); return o(nom); }; })(window.pedir);
window.vSedes=(function(o){ return function(){
  var h=o(); if(nivel()!=='corp'||!CORP.site) return h;
  var s=S.sedes.find(function(x){ return x.clienteId===CORP.site; }); if(!s||!s.fum) return h;
  var i=h.indexOf('<div class="grid g2" style="margin-top:16px">'); return i<0?h:h.slice(0,i)+'<div style="margin-top:16px">'+fumCard(s)+'</div>'+h.slice(i);
}; })(window.vSedes);

/* ── pintar: las vistas nuevas y sus oyentes ── */
window.pintar=function(){
  P0.pintar();
  var m=$('main'); if(!m||!S) return;
  if(V==='calendario'&&nivel()==='corp') m.innerHTML=avisoCuenta()+titulo('Calendario de recolecciones','Fechas y cantidad de visitas por sede durante el mes.')+calView()+'<div class="pie-p">'+legal()+'</div>';
  if(V==='seguimiento'&&nivel()!=='corp') m.innerHTML=avisoCuenta()+vSeguimiento()+'<div class="pie-p">'+legal()+'</div>';
  if(nivel()!=='corp'&&(V==='inicio'||V==='seguimiento')){ sgCargar(); if(V==='seguimiento') sgPintarMapa(); }   // api 3.37
  var fr=$('r-request'); if(fr){ fr.onsubmit=enviarSolicitud; var sd=$('r-sede'); if(sd&&SOL.sede){ sd.value=SOL.sede; SOL.sede=''; } }
  document.querySelectorAll('[data-request]').forEach(function(r){ var i=r.getAttribute('data-request');
    r.onclick=function(){ verSolicitud(i); }; r.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); verSolicitud(i); } }; });
  var cs=$('cal-site'); if(cs) cs.onchange=function(){ CAL.site=this.value; pintar(); };
  var q=$('corp-search'); if(q) q.oninput=function(){ CORP.query=this.value; var p=this.selectionStart; pintar(); var n=$('corp-search'); if(n){ n.focus(); n.setSelectionRange(p,p); } };
  var fl2=$('corp-filter'); if(fl2) fl2.onchange=function(){ CORP.filter=this.value; pintar(); };
};
/* las secciones nuevas no existen en «abierto»: con la cuenta en pausa, solo lo de siempre */
window.abierto=(function(o){ return function(v){ if(v==='calendario'||v==='seguimiento') return S.cuenta.estado!=='suspendida'; return o(v); }; })(window.abierto);
document.addEventListener('keydown',function(e){ if(e.key==='Escape') cerrarModal(); });
if(S) pintar();
})();
