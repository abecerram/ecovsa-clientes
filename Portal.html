     Entra con un PIN de 6 números propio de cada persona; los accesos los da el administrador. -->
<script>window.PUENTE_CONFIG={sinCopia:/./, indicador:'oculto', enSupabase:/^api_(?!optimizarRuta$)/, escritura:/^api_ptl(?!Inicio$|Invitacion$|Constancia$)|^api_pedir/};</script>

<style>
:root{
  --navy:#0f2a57; --marca:#14306b; --acento:#F5B301; --tinta:#0f2140; --gris:#667489;
  --fondo:#f3f5f8; --tarjeta:#fff; --linea:#e1e6ee; --suave:#f6f8fb; --azulclaro:#e8effb;
  --ok:#2f9e44; --ok-bg:#eaf6e4; --warn:#a87400; --warn-bg:#fff4d6; --bad:#d64045; --bad-bg:#fdecea; --info:#3b6fd4; --info-bg:#e8effb;
  --letra:Archivo,system-ui,-apple-system,"Segoe UI",Arial,sans-serif; --radio:14px; --radio-b:9px; color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--fondo);color:var(--tinta);font:15px/1.5 var(--letra);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.barra{background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:calc(8px + env(safe-area-inset-top,0px)) 18px 8px;min-height:58px;position:sticky;top:0;z-index:20}
.barra img.l{height:15px;display:block}
.barra .sep{width:1px;height:24px;background:rgba(255,255,255,.22)}
.barra .mod{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.barra .sp{flex:1}
.barra .usr{display:flex;gap:9px;align-items:center;font-size:13px}
.barra .av{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.barra .salir{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:4px 10px;cursor:pointer;font-size:12.5px}
.cuerpo{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 58px)}
.menu{background:#fff;border-right:1px solid var(--linea);padding:14px 10px}
.menu h6{margin:12px 10px 6px;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--gris)}
.menu button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;background:none;border:0;border-radius:9px;padding:9px 10px;cursor:pointer;color:var(--tinta);font-size:14px}
.menu button:hover{background:var(--suave)}
.menu button[aria-current="page"]{background:var(--azulclaro);color:var(--marca);font-weight:700}
.menu button[disabled]{opacity:.45;cursor:not-allowed}
.menu .n{margin-left:auto;background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;font-weight:700}
.main{padding:22px 24px 40px;min-width:0;max-width:1080px}
.main h1{font-size:22px;margin:0 0 2px;color:var(--marca);text-wrap:balance}
.main .bajada{color:var(--gris);margin:0 0 16px}
@media (max-width:820px){
  .cuerpo{grid-template-columns:minmax(0,1fr)}
  .menu{border-right:0;border-bottom:1px solid var(--linea);padding:8px 10px;display:flex;gap:4px;overflow-x:auto;position:sticky;top:58px;z-index:10}
  .menu h6{display:none}.menu button{width:auto;white-space:nowrap;padding:7px 11px;font-size:13.5px}
  .main{padding:16px 16px 40px}.barra .usr span{display:none}
}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:820px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--radio);padding:16px 18px;min-width:0}
.card>h3{margin:0 0 10px;font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--gris);display:flex;gap:8px;align-items:center}
.card>h3 .sp{flex:1}
.kpi b{display:block;font-size:26px;line-height:1.15;color:var(--tinta);font-variant-numeric:tabular-nums}
.kpi span{color:var(--gris);font-size:13px}
.tag{display:inline-flex;gap:5px;align-items:center;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.t-ok{background:var(--ok-bg);color:var(--ok)}.t-warn{background:var(--warn-bg);color:var(--warn)}.t-bad{background:var(--bad-bg);color:var(--bad)}.t-info{background:var(--info-bg);color:var(--info)}.t-gris{background:#eef1f5;color:var(--gris)}
.btn{display:inline-flex;gap:7px;align-items:center;justify-content:center;background:#fff;border:1px solid #cdd5e1;color:var(--marca);border-radius:var(--radio-b);padding:8px 14px;font-weight:600;cursor:pointer;font-size:14px;text-decoration:none}
.btn:hover{background:var(--suave)}.btn.pri{background:var(--marca);border-color:var(--marca);color:#fff}.btn.sm{padding:5px 10px;font-size:13px}.btn[disabled]{opacity:.5;cursor:not-allowed}
.fila{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid #eef1f5}
.fila:first-of-type{border-top:0}.fila .tx{flex:1;min-width:0}.fila .tx small{display:block;color:var(--gris)}
.fecha{flex:none;width:50px;text-align:center;border:1px solid var(--linea);border-radius:10px;padding:4px 0;line-height:1.1}
.fecha b{display:block;font-size:19px;color:var(--marca)}.fecha span{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris)}
.tabla{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--gris);border-bottom:1.5px solid var(--linea);padding:8px 8px;white-space:nowrap}
td{border-bottom:1px solid #eef1f5;padding:10px 8px;vertical-align:middle}
td small{display:block;color:var(--gris)}
.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.aviso{display:flex;gap:12px;align-items:flex-start;border-radius:12px;padding:12px 14px;margin:0 0 16px}
.aviso .tx{flex:1}.aviso.warn{background:var(--warn-bg);color:#5c4200}.aviso.bad{background:var(--bad-bg);color:#7d1d16}.aviso.info{background:var(--info-bg);color:#1f3f86}.aviso.ok{background:var(--ok-bg);color:#1d5e22}
.aviso .acc{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pista{background:var(--suave);border:1px dashed #cfd7e3;border-radius:10px;padding:9px 12px;color:var(--gris);font-size:13px}
.campo{display:grid;gap:5px;margin-bottom:12px}.campo label{font-size:12.5px;font-weight:700;color:var(--gris)}
.campo input,.campo select,.campo textarea{border:1px solid #cdd5e1;border-radius:var(--radio-b);padding:9px 11px;background:#fff;width:100%}
.candado{display:grid;place-items:center;text-align:center;padding:30px 16px;color:var(--gris)}
.ent{max-width:420px;margin:0 auto;padding:34px 16px}
.ent .card{text-align:center;padding:26px 22px}
.ent .eco-lg{margin:0 auto;box-shadow:0 0 0 1px var(--linea),0 8px 24px rgba(15,33,64,.1)}
.ent h2{margin:12px 0 4px;color:var(--marca);font-size:20px}
.pts{display:flex;gap:9px;justify-content:center;margin:16px 0}
.pts i{width:16px;height:16px;border-radius:50%;border:2px solid #b8c2d2}.pts i.on{background:var(--marca);border-color:var(--marca)}
.tec{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:270px;margin:0 auto}
.tec button{height:52px;border-radius:12px;border:1px solid var(--linea);background:#fff;font-size:20px;font-weight:600;cursor:pointer}
.tec button:hover{background:var(--suave)}
.msg{min-height:20px;color:var(--bad);font-size:13.5px;margin-top:8px}
.fondo{position:fixed;inset:0;background:rgba(15,33,64,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto}
.modal{background:#fff;border-radius:16px;width:100%;max-width:520px;padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{margin:0 0 4px;font-size:18px;color:var(--marca)}.modal .pie{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.catg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.cat{border:1px solid var(--linea);border-radius:12px;padding:12px 14px;background:#fff;display:flex;flex-direction:column;gap:6px}
.cat b{font-size:14.5px}.cat small{color:var(--gris);flex:1}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0f2140;color:#fff;border-radius:10px;padding:10px 16px;font-size:14px;display:none;z-index:60;max-width:90vw}
.pie-p{padding:20px 16px 28px;text-align:center;font-size:11.5px;color:#6a7689;line-height:1.6}
</style>
</head>
<body>
<div id="app"><div class="ent"><div class="card" id="espera">Abriendo su portal…</div></div></div>
<div id="toast"></div>
<script>
/* ═══ utilidades ═══ */
/* en clientes.ecovsaapp.com los documentos (recibo, certificados) se abren desde ecovsaapp.com */
var DOCS = /^clientes\./.test(location.hostname) ? 'https://ecovsaapp.com/' : '';
function doc(u){ return /^https?:/.test(u||'') ? u : DOCS + (u||''); }
var S = null, SES = '', V = 'inicio', PIN = '', PIN1 = '', ESTADO = '', INV = '', CLI = '', COD = '';
var MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'], MESL = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function $(i){ return document.getElementById(i); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function q(k){ var m=(location.search||'').match(new RegExp('[?&]'+k+'=([^&]+)')); return m?decodeURIComponent(m[1]):''; }
function f(i){ var d=new Date(String(i)+'T12:00:00'); return isNaN(d)?String(i||''):d.getDate()+' '+MES[d.getMonth()]+' '+d.getFullYear(); }
function fl(i){ var d=new Date(String(i)+'T12:00:00'); return isNaN(d)?String(i||''):d.getDate()+' de '+MESL[d.getMonth()]+' de '+d.getFullYear(); }
function kg(v){ return (Math.round((Number(v)||0)*100)/100).toLocaleString('es-PA'); }
function B(v){ return 'B/. '+(Number(v)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function toast(t){ var a=$('toast'); a.textContent=t; a.style.display='block'; clearTimeout(a._t); a._t=setTimeout(function(){ a.style.display='none'; },3500); }
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k)||''; if(v) localStorage.setItem(k,v); else localStorage.removeItem(k); }catch(e){ return ''; } }
function llamar(fn){ var a=[].slice.call(arguments,1); return new Promise(function(ok,no){ var r=google.script.run.withSuccessHandler(ok).withFailureHandler(no); r[fn].apply(r,a); }); }
function logo(px,arma){ return window.ECOCARGA?ECOCARGA.logo(px||76,{arma:!!arma}):'<img src="logo-ecovsa.png" alt="ECOVSA" style="width:'+(px||76)+'px">'; }
function cerrarModal(){ var m=$('fondo'); if(m) m.remove(); }
function modal(h){ cerrarModal(); var d=document.createElement('div'); d.className='fondo'; d.id='fondo'; d.innerHTML='<div class="modal" role="dialog">'+h+'</div>'; d.onclick=function(e){ if(e.target===d) cerrarModal(); }; document.body.appendChild(d); }
function ocupado(b,si,t){ if(!b) return; if(si){ b._t=b.innerHTML; b.disabled=true; b.textContent=t||'Enviando…'; } else { b.disabled=false; if(b._t) b.innerHTML=b._t; } }

/* ═══ entrada ═══ */
function pantallaPin(titulo, sub, extra){
  $('app').innerHTML='<div class="ent"><div class="card">'+logo(76,true)+'<h2>'+titulo+'</h2><p style="color:var(--gris);margin:0">'+sub+'</p><div class="pts" id="pts"></div>'+
    '<div class="tec" id="tec">'+['1','2','3','4','5','6','7','8','9','','0','⌫'].map(function(x){ return x===''?'<span></span>':'<button type="button" data-k="'+x+'" aria-label="'+(x==='⌫'?'Borrar':x)+'">'+x+'</button>'; }).join('')+'</div>'+
    '<div class="msg" id="msg"></div>'+(extra||'')+'</div></div>';
  PIN=''; pts();
  $('tec').onclick=function(e){ var b=e.target.closest('button'); if(!b) return; var k=b.getAttribute('data-k'); if(k==='⌫') PIN=PIN.slice(0,-1); else if(PIN.length<6) PIN+=k; pts(); if(PIN.length===6) setTimeout(alPin,120); };
}
document.addEventListener('keydown',function(e){ if(!$('tec')) return; if(/^\d$/.test(e.key)&&PIN.length<6){ PIN+=e.key; pts(); if(PIN.length===6) setTimeout(alPin,120); } else if(e.key==='Backspace'){ PIN=PIN.slice(0,-1); pts(); } });
function pts(){ var p=$('pts'); if(p){ var h=''; for(var i=0;i<6;i++) h+='<i class="'+(i<PIN.length?'on':'')+'"></i>'; p.innerHTML=h; } }
var alPin=function(){};
function entrar(){
  ESTADO='entrar';
  pantallaPin('Entrar a su portal','Escriba su PIN de 6 números.',
    '<p style="margin:16px 0 0;font-size:13.5px">'+(CLI?'<a href="?cli='+encodeURIComponent(CLI)+'&cod='+encodeURIComponent(COD)+'&p=activar">¿Primera vez? Activar mi acceso</a> · <a href="?cli='+encodeURIComponent(CLI)+'&cod='+encodeURIComponent(COD)+'&p=olvide">Olvidé mi PIN</a>':'¿Primera vez u olvidó su PIN? Escanee el QR del distintivo de su establecimiento o escríbanos al WhatsApp <b>6264-1647</b>.')+'</p>');
  alPin=function(){ var m=$('msg'); m.style.color='var(--gris)'; m.textContent='Revisando…';
    llamar('api_ptlEntrar',PIN).then(function(r){ if(!r||!r.ok){ m.style.color=''; m.textContent=(r&&r.error)||'No se pudo entrar.'; PIN=''; pts(); return; } SES=r.sesion; ls('ptl_ses',SES); cargar(); },
      function(){ m.style.color=''; m.textContent='Sin conexión. Intente de nuevo.'; PIN=''; pts(); }); };
}
function invitacion(){
  llamar('api_ptlInvitacion',INV).then(function(r){
    if(!r||!r.ok){ $('app').innerHTML='<div class="ent"><div class="card">'+logo(76)+'<h2>Invitación no válida</h2><p style="color:var(--gris)">'+esc((r&&r.error)||'')+'</p><a class="btn pri" href="Portal.html">Entrar con mi PIN</a></div></div>'; return; }
    var de=r.nivel==='corp'?'<b>'+esc(r.de)+'</b> (todas las sedes)':'<b>'+esc(r.de)+'</b>';
    var crear=function(){ pantallaPin('Bienvenido, '+esc(String(r.nombre).split(' ')[0]),'ECOVSA le da acceso al portal de '+de+'.<br><b style="color:var(--tinta)">Cree su PIN de 6 números.</b>','<p class="pista" style="margin-top:14px">No use su fecha de nacimiento ni números seguidos. Es solo suyo: no lo comparta.</p>');
      alPin=function(){ PIN1=PIN; pantallaPin('Repita su PIN','Escríbalo otra vez para confirmarlo.'); alPin=function(){
        var m=$('msg'); m.style.color='var(--gris)'; m.textContent='Guardando…';
        llamar('api_ptlCrearPin',INV,PIN1,PIN).then(function(x){ if(!x||!x.ok){ toast((x&&x.error)||'No se pudo'); crear(); setTimeout(function(){ var mm=$('msg'); if(mm) mm.textContent=(x&&x.error)||''; },50); return; }
          SES=x.sesion; ls('ptl_ses',SES); history.replaceState(null,'','Portal.html'); guia(); }, function(){ m.style.color=''; m.textContent='Sin conexión. Intente de nuevo.'; }); }; }; };
    crear();
  },function(){ toast('Sin conexión'); });
}
var EV_INST=null; window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); EV_INST=e; });
function guia(){
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  $('app').innerHTML='<div class="ent" style="max-width:520px"><div class="card"><span class="tag t-ok">✓ PIN creado</span><h2>Tenga ECOVSA en su celular</h2><p style="color:var(--gris);margin:0 0 14px">Un toque y le queda el ícono de ECOVSA junto a sus aplicaciones. No hay que descargar nada.</p>'+
    (ios?'<div class="pista" style="text-align:left">En iPhone: toque el botón <b>Compartir</b> (el cuadro con la flecha) y elija <b>«Agregar a inicio»</b>.</div>':
      '<button class="btn pri" id="inst" type="button">Instalar ECOVSA</button><div class="pista" style="text-align:left;margin-top:10px">Si no aparece el botón: menú del navegador (⋮) › <b>«Agregar a la pantalla principal»</b>.</div>')+
    '<div style="display:flex;gap:8px;justify-content:center;margin-top:16px"><button class="btn" type="button" onclick="cargar()">Ahora no</button><button class="btn pri" type="button" onclick="cargar()">Entrar a mi portal</button></div></div></div>';
  var b=$('inst'); if(b) b.onclick=function(){ if(EV_INST){ EV_INST.prompt(); EV_INST=null; } else toast('Use el menú del navegador › «Agregar a la pantalla principal»'); };
}
function pedirAcceso(tipo){
  var olv=tipo==='olvide';
  $('app').innerHTML='<div class="ent"><div class="card" style="text-align:left">'+'<div style="text-align:center">'+logo(70,true)+'</div><h2 style="text-align:center">'+(olv?'Olvidé mi PIN':'Activar mi acceso')+'</h2>'+
    '<p style="color:var(--gris);margin:0 0 14px;text-align:center">'+(olv?'Pida un PIN nuevo. ':'Pida su acceso al portal de este establecimiento. ')+'Por seguridad, ECOVSA le manda la invitación al WhatsApp registrado del establecimiento.</p>'+
    '<div class="campo"><label for="pa-n">Su nombre</label><input id="pa-n" autocomplete="name"></div><div class="campo"><label for="pa-c">Su cargo</label><input id="pa-c" placeholder="Ej. Administradora"></div>'+
    '<div class="campo"><label for="pa-o">Nota (opcional)</label><input id="pa-o"></div><button class="btn pri" style="width:100%" id="pa-b" type="button">Enviar el pedido</button><div class="msg" id="msg"></div>'+
    '<p style="text-align:center;margin:14px 0 0;font-size:13.5px"><a href="Portal.html'+(CLI?'?cli='+encodeURIComponent(CLI)+'&cod='+encodeURIComponent(COD):'')+'">Ya tengo mi PIN</a></p></div></div>';
  $('pa-b').onclick=function(){ var b=this; ocupado(b,true);
    llamar('api_ptlPedirAcceso',CLI,COD,{tipo:olv?'olvide':'activar',nombre:$('pa-n').value,cargo:$('pa-c').value,nota:$('pa-o').value}).then(function(r){ ocupado(b,false);
      if(!r||!r.ok){ $('msg').textContent=(r&&r.error)||'No se pudo'; return; }
      $('app').innerHTML='<div class="ent"><div class="card">'+logo(70)+'<h2>Pedido recibido</h2><p style="color:var(--gris)">'+esc(r.mensaje||'')+'</p>'+(r.folio?'<span class="tag t-info">'+esc(r.folio)+'</span>':'')+'</div></div>'; },
      function(){ ocupado(b,false); $('msg').textContent='Sin conexión. Intente de nuevo.'; }); };
}

/* ═══ portal ═══ */
function cargar(){
  if(!SES){ entrar(); return; }
  if(!S) $('app').innerHTML='<div class="ent"><div class="card">'+logo(76,true)+'<p style="color:var(--gris);margin:14px 0 0">Trayendo su información…</p></div></div>';
  llamar('api_ptlInicio',SES).then(function(r){
    if(!r||!r.ok){ if(r&&r.salir){ SES=''; ls('ptl_ses',''); S=null; entrar(); setTimeout(function(){ var m=$('msg'); if(m) m.textContent=r.error||''; },60); return; } toast((r&&r.error)||'No se pudo'); return; }
    S=r; pintar();
  },function(){ toast('Sin conexión. Intente de nuevo en un momento.'); if(!S) $('app').innerHTML='<div class="ent"><div class="card">'+logo(76)+'<h2>Sin conexión</h2><p style="color:var(--gris)">No pudimos conectar. Revise su señal.</p><button class="btn pri" onclick="cargar()">Reintentar</button></div></div>'; });
}
function salir(){ llamar('api_ptlSalir',SES).catch(function(){}); SES=''; S=null; ls('ptl_ses',''); entrar(); }
function nivel(){ return S.yo.nivel; }
function abierto(v){
  var c=S.cuenta.estado, n=nivel();
  if(c!=='suspendida') return true;
  if(n==='micro') return v==='facturas';
  if(n==='corp') return v==='inicio'||v==='facturas';
  return v==='inicio';
}
function menu(){
  var n=nivel(), pend=S.pedidos.filter(function(p){ return !p.cerrada; }).length;
  var L=[['GENERAL',[['inicio',n==='corp'?'Resumen':'Inicio']].concat(n==='corp'?[['sedes','Sus sedes']]:[])],
    ['DOCUMENTOS',[['recibos','Recibos de visita'],['certificados','Certificados']].concat(n==='sede'?[]:[['facturas','Facturas y pagos']])],
    ['SERVICIOS',[['servicios','Servicios y productos'],['solicitudes','Solicitudes',pend]]]].concat(n==='corp'?[['SU EMPRESA',[['equipo','Accesos de su equipo']]]]:[]);
  return L.map(function(g){ return '<h6>'+g[0]+'</h6>'+g[1].map(function(b){ var ok=abierto(b[0]); return '<button type="button" data-v="'+b[0]+'"'+(V===b[0]?' aria-current="page"':'')+(ok?'':' disabled title="Disponible al regularizar su cuenta"')+'>'+b[1]+(b[2]?'<span class="n">'+b[2]+'</span>':'')+'</button>'; }).join(''); }).join('');
}
function pintar(){
  if(!abierto(V)) V=nivel()==='micro'&&S.cuenta.estado==='suspendida'?'facturas':'inicio';
  var y=S.yo, cuenta=y.nivel==='corp'?y.razonSocial:(S.sedes[0]||{}).nombre, ini=String(y.nombre||'').split(' ').map(function(x){ return x.charAt(0); }).join('').slice(0,2).toUpperCase();
  $('app').innerHTML='<div class="barra"><img class="l" src="ecovsa-letras.png" alt="ECOVSA"><span class="sep"></span><span class="mod">'+esc(cuenta)+'</span><span class="sp"></span><span class="usr"><span>'+esc(y.nombre)+'</span><span class="av">'+esc(ini)+'</span></span><button class="salir" type="button" onclick="salir()">Salir</button></div>'+
    '<div class="cuerpo"><nav class="menu" id="menu" aria-label="Secciones">'+menu()+'</nav><main class="main" id="main"></main></div>';
  $('menu').onclick=function(e){ var b=e.target.closest('button[data-v]'); if(!b||b.disabled) return; V=b.getAttribute('data-v'); pintar(); window.scrollTo(0,0); };
  var vistas={inicio:vInicio,sedes:vSedes,recibos:vRecibos,certificados:vCerts,facturas:vFacturas,servicios:vServicios,solicitudes:vSolicitudes,equipo:vEquipo};
  $('main').innerHTML=avisoCuenta()+(vistas[V]||vInicio)()+'<div class="pie-p">'+legal()+'</div>';

function avisoCuenta(){
  var c=S.cuenta, n=nivel();
  if(c.estado==='suspendida') return '<div class="aviso bad"><div class="tx"><b>Su servicio está en pausa.</b> '+(n==='sede'?'La corporación maneja el pago de la cuenta. ':'Para reactivarlo, regularice las facturas pendientes. ')+'Escríbanos al WhatsApp 6264-1647.'+(n!=='sede'?'<div class="acc"><button class="btn sm pri" onclick="comprobante()">Subir comprobante</button><button class="btn sm" onclick="plan()">Proponer un plan de pago</button></div>':'')+'</div></div>';
  if(c.estado==='atraso'&&n!=='sede') return '<div class="aviso warn"><div class="tx"><b>Tiene '+(c.vencidas.length||'')+' factura'+(c.vencidas.length===1?'':'s')+' vencida'+(c.vencidas.length===1?'':'s')+'</b>'+(c.vencidas.length?' ('+c.vencidas.map(function(v){ return esc(v.factura)+' · '+B(v.saldo); }).join(', ')+')':'')+'. Los certificados de los periodos sin pagar se liberan al confirmar el pago.'+
    '<div class="acc"><button class="btn sm pri" onclick="comprobante()">Subir comprobante</button><button class="btn sm" onclick="plan()">Proponer un plan de pago</button></div></div></div>';
  return '';
}
function legal(){ var e=S.empresa||{}; return esc(e.razonSocial||'')+' · '+esc(e.comercial||'ECOVSA')+' · RUC '+esc(e.ruc||'')+(e.dv?' DV '+esc(e.dv):'')+'<br>'+esc(e.direccion||'')+'<br>'+esc(e.resolucion||'')+'<br>Tel. 310-2268 · WhatsApp 6264-1647 · info@ecovsa.com'; }

function vInicio(){
  var n=nivel(), sedes=S.sedes, rec=S.recibos, mes=S.hoy.slice(0,7);
  var visMes=rec.filter(function(r){ return r.fecha.slice(0,7)===mes; }).length, kg90=sedes.reduce(function(s,x){ return s+x.kg90; },0), ult=rec[0];

  h+='<div class="grid g4">'+[[visMes,'visitas este mes'],[kg(kg90)+' kg','recolectados en 90 días'],[ult?f(ult.fecha):'—','última visita'+(ult&&n==='corp'?' · '+ult.sede:'')],[n==='sede'?S.certificados.length:B(S.cuenta.saldo),n==='sede'?'certificados':'saldo de la cuenta']].map(function(k){ return '<div class="card kpi"><b>'+esc(k[0])+'</b><span>'+esc(k[1])+'</span></div>'; }).join('')+'</div>';
  h+='<div class="grid g2" style="margin-top:14px"><div class="card"><h3>Últimas visitas<span class="sp"></span><button class="btn sm" onclick="ir(\'recibos\')">Ver todas</button></h3>'+(rec.length?rec.slice(0,5).map(filaRec).join(''):'<p style="color:var(--gris)">Todavía no hay visitas registradas.</p>')+'</div>'+
    '<div class="card"><h3>Su certificado de servicio</h3>'+(S.servicio.length?S.servicio.map(function(c){ return '<div class="fila"><div class="tx"><b>N.° '+esc(c.numero||c.folio)+'</b><small>'+(c.tipo==='cuenta'?'De la cuenta':'De '+esc(c.establecimiento))+' · vigente hasta el '+fl(c.vence)+'</small></div><a class="btn sm" href="'+esc(doc(c.url))+'" target="_blank" rel="noopener">Ver</a></div>'; }).join(''):'<p style="color:var(--gris);margin:0">Su certificado de servicio llega con la entrega del distintivo. Si lo necesita antes, pídalo en «Servicios y productos».</p>')+
    '<div class="pista" style="margin-top:12px">Desechos sólidos: <b>próximamente</b> en su portal.</div></div></div>';
  return h;

function comprobante(){
  var abiertas=(S.facturas||[]).filter(function(x){ return x.saldo>0.009; });
  modal('<h2>Subir comprobante de pago</h2><p style="color:var(--gris);margin:0 0 12px">Foto o PDF de la transferencia, el depósito o el cheque. Cobros lo confirma.</p>'+
    '<div class="campo"><label for="cp-f">Comprobante</label><input id="cp-f" type="file" accept="image/*,application/pdf"></div>'+
    '<div class="campo"><label for="cp-m">Monto pagado (B/.)</label><input id="cp-m" type="number" step="0.01" min="0" inputmode="decimal"></div>'+
    '<div class="campo"><label for="cp-x">Facturas que paga</label><input id="cp-x" value="'+esc(abiertas.map(function(x){ return x.factura; }).join(', '))+'"></div>'+
    '<div class="campo"><label for="cp-r">Referencia (opcional)</label><input id="cp-r"></div><div id="cp-t"></div>'+
    '<div class="pie"><button class="btn" onclick="cerrarModal()">Cancelar</button><button class="btn pri" id="cp-b">Enviar</button></div>');
  $('cp-b').onclick=function(){
    var b=this, file=$('cp-f').files&&$('cp-f').files[0];
    if(!file){ toast('Elija la foto o el PDF del comprobante'); return; }
    if(!window.ARCH){ toast('No cargó el módulo de archivos. Recargue la página.'); return; }
    ocupado(b,true,'Subiendo…'); var prep;
    ARCH.preparar(file).then(function(p){ prep=p; return llamar('api_ptlSubirComprobante',SES,p.meta); })
      .then(function(r){ if(!r||!r.ok) throw new Error((r&&r.error)||'No se pudo'); return ARCH.subir(r.subida,prep).then(function(){ return r.archivoId; }); })
      .then(function(id){ return llamar('api_ptlComprobanteListo',SES,id,{monto:$('cp-m').value,facturas:$('cp-x').value,referencia:$('cp-r').value}); })
      .then(function(r){ ocupado(b,false); if(!r||!r.ok){ toast((r&&r.error)||'No se pudo'); return; } cerrarModal(); toast('Comprobante enviado a Cobros · '+r.folio); cargar(); },
        function(e){ ocupado(b,false); toast((e&&e.message)||'No se pudo subir'); });
  };
}

(function(){
  CLI=q('cli'); COD=q('cod'); INV=q('inv'); SES=ls('ptl_ses');
