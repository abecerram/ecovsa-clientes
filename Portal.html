/* ═══ entrada · api 3.39 «Mañana clara» (Álvaro, 23 oct: B-A-A-A) ═══
   Todas las pantallas antes de entrar (PIN, crear el PIN, activar el acceso, pedido recibido, invitación no válida)
   viven en la misma escena clara: el emblema se arma y luego respira, burbujitas verdes y azules muy tenues que suben,

var E2 = { anim: 0 };

function e2Burbujas(c){
  if(!c) return; cancelAnimationFrame(E2.anim);
  var quieto=false; try{ quieto=matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  var x=c.getContext('2d'), L=[], W, H, dpr=Math.min(2,window.devicePixelRatio||1);
  function talla(){ W=innerWidth; H=innerHeight; c.width=W*dpr; c.height=H*dpr; x.setTransform(dpr,0,0,dpr,0,0); }
  function nueva(y){ return { x:Math.random()*W, y:y==null?H+10:y, r:2+Math.random()*5, v:.22+Math.random()*.35, o:.25+Math.random()*.6, f:Math.random()*6.28, s:.3+Math.random()*.6, g:Math.random()<.4 }; }
  talla(); addEventListener('resize',talla);
  for(var i=0;i<34;i++) L.push(nueva(Math.random()*H));

    if(!c.isConnected) return;
    x.clearRect(0,0,W,H);
    L.forEach(function(p,i){ if(!quieto){ p.y-=p.v; p.f+=.01*p.s; } var px=p.x+Math.sin(p.f)*14, o=p.o*Math.min(1,p.y/(H*.25));

}

/* 3.18.1 · la espera: el emblema se arma y después las flechas siguen girando hasta que llegan los datos */
function espera(t){
  $('app').innerHTML='<div class="cg-a">'+logo(110,true)+'<div><b>Mi portal ECOVSA</b><p>'+esc(t)+'</p></div></div>';
  var l=document.querySelector('#app .cg-a .eco-lg');
  if(l) setTimeout(function(){ if(l.isConnected){ l.classList.remove('arma'); l.classList.add('gira'); } },1750);
}
/* 3.18.2 · la entrada: la cortina azul con el emblema que se arma, las letras ECOVSA y «Mi portal»
   (la misma de los módulos del equipo). Dura al menos ENTRADA_MIN para que se vea completa;
   si los datos tardan más, las flechas siguen girando hasta que lleguen. */
var ENTRADA_MIN=3600, ENTRADA_T=0;
function entrada(){
  if(window.ECOCARGA&&ECOCARGA.cortina){ ENTRADA_T=Date.now(); ECOCARGA.cortina({modulo:'Mi portal',mensaje:'Trayendo su información…',claro:true}); if(instalada()) despierta(); }
  else espera('Trayendo su información…');
}
/* 3.18.3 · en la app instalada el teléfono muestra primero el emblema quieto (eso no se puede animar).
   La cortina arranca con el emblema del MISMO tamaño y en el MISMO lugar, da una vuelta (cobra vida),
   se achica a su puesto y aparecen las letras: se ve como una sola animación. */
function despierta(){
  var c=document.getElementById('eco-cortina'), l=c&&c.querySelector('.eco-lg'); if(!l) return;
  try{ if(matchMedia('(prefers-reduced-motion: reduce)').matches) return; }catch(e){}
  ENTRADA_MIN=4600; window.__desp=performance.now();
  document.documentElement.classList.add('eco-desp');
  var gr=Math.round(Math.min(innerWidth*0.5,innerHeight*0.32,300));
  l.classList.remove('arma'); l.classList.add('quieto');
  l.style.width=l.style.height=gr+'px';
  var r=l.getBoundingClientRect(), dy=Math.round(innerHeight/2-(r.top+r.height/2));
  l.style.transform='translateY('+dy+'px)'; l.style.boxShadow='none';
  void l.offsetWidth; l.classList.remove('quieto');
  setTimeout(function(){ if(l.isConnected){ l.classList.add('vuelta'); } },250);
  setTimeout(function(){ if(l.isConnected){ l.classList.remove('vuelta'); void l.offsetWidth; l.classList.add('vuelta'); } },1150);
  setTimeout(function(){ if(l.isConnected){ l.classList.remove('vuelta'); l.style.width=l.style.height=''; l.style.transform=''; l.style.boxShadow=''; } },2050);
  setTimeout(function(){ if(l.isConnected){ l.classList.add('gira'); } },2700);
}
function finEntrada(ya){
  if(!ENTRADA_T||!window.ECOCARGA) return;
  var falta=ya?0:Math.max(0,ENTRADA_MIN-(Date.now()-ENTRADA_T)); ENTRADA_T=0;
  setTimeout(function(){ ECOCARGA.listo(); },falta);
}
function cargar(){
  if(!SES){ entrar(); return; }
  if(!S) entrada();
  llamar('api_ptlInicio',SES).then(function(r){
    if(!r||!r.ok){ finEntrada(!(r&&r.salir)); if(r&&r.salir&&VISTA){ vistaFin(r.error); return; } if(r&&r.salir){ SES=''; ls('ptl_ses',''); S=null; entrar(); setTimeout(function(){ var m=$('msg'); if(m) m.textContent=r.error||''; },60); return; } toast((r&&r.error)||'No se pudo'); return; }
    var espHoja=ENTRADA_T?Math.max(0,ENTRADA_MIN-(Date.now()-ENTRADA_T))+1300:350;
    S=r; pintar(); finEntrada(false);
    if(tocaHoja()) setTimeout(hojaIns,espHoja);
  },function(){ finEntrada(true); toast('Sin conexión. Intente de nuevo en un momento.'); if(!S) escena('<h2>Sin conexión</h2><p class="sub">No pudimos conectar. Revise su señal e intente de nuevo.</p><div style="height:16px"></div><button class="btn pri ancho" onclick="cargar()">Reintentar</button>'); });
}

  var arcs=seg.map(function(x){ var l=x[0]/T*C, s='<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="'+x[1]+'" stroke-width="22" stroke-dasharray="'+l.toFixed(1)+' '+(C-l).toFixed(1)+'" stroke-dashoffset="'+(-off).toFixed(1)+'" transform="rotate(-90 70 70)"/>'; off+=l; return s; }).join('');
  return '<div class="dn"><svg viewBox="0 0 140 140" width="150" height="150" role="img" aria-label="Reparto por tipo"><circle cx="70" cy="70" r="'+R+'" fill="none" stroke="#e9edf3" stroke-width="22"/>'+arcs+
    '<text x="70" y="66" text-anchor="middle" font-size="17" font-weight="800" fill="var(--tinta)">'+kg(T)+'</text><text x="70" y="84" text-anchor="middle" font-size="10.5" fill="var(--gris)">kg en total</text></svg>'+
    '<div class="lg">'+seg.map(function(x){ return '<div><i style="background:'+x[1]+'"></i><span>'+x[2]+'</span><b>'+kg(x[0])+' kg</b><small>'+Math.round(x[0]/T*100)+' %</small></div>'; }).join('')+'</div></div>';
}

  h+='<div class="sdc">'+L.map(function(s){ var v=vm(s); return '<div class="s" data-sd="'+esc(s.clienteId)+'"><div class="t"><b>'+esc(s.nombre)+'<small>'+esc(cap(s.frecuencia))+' · '+esc(s.direccion)+'</small></b>'+estSede(s)+'</div>'+

<script>
/* api 3.35 · PORTAL 2.0 (rediseño de Álvaro, «portal clientes 2.0», 22 oct 2026), conectado al servidor.

(function(){

var SG={ v:null, t:0, cargando:false, mapa:null, hoy:'' };
function sgCargar(forzar){
  if(!S||!SES||nivel()==='corp'||SG.cargando) return;

  SG.cargando=true;
  llamar('api_ptlSeguimiento',SES).then(function(r){
    SG.cargando=false; SG.t=Date.now();
    if(!r||!r.ok) return;
    var antes=JSON.stringify(SG.v); SG.v=r.visita||null; SG.hoy=r.hoy||'';

}

/* ── Calendario de recolecciones (corporativo): realizadas = recibos; estimadas = según frecuencia ── */
function calEvents(){
  var ym=S.hoy.slice(0,7), y=Number(ym.slice(0,4)), mo=Number(ym.slice(5,7))-1, ult=new Date(y,mo+1,0).getDate(), ev=[];
  var iso=function(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
  S.sedes.forEach(function(s){
    var R=S.recibos.filter(function(r){ return r.sede===s.nombre&&r.fecha.slice(0,7)===ym; });
    R.forEach(function(r){ ev.push({ site:s.clienteId, name:s.nombre, date:r.fecha, status:'realizada', kg:r.kg }); });
    if(s.estado!=='activo') return;
    var nx=corpNext(s); if(!nx) return;
    var dias=Number(s.lleno&&s.lleno.dias)||0, F=[];
    if(dias>0&&dias<=31){
      var a=new Date(nx+'T12:00:00'), ini=new Date(y,mo,1,12), fin=new Date(y,mo,ult,12), d=new Date(a);
      while(d>ini) d.setDate(d.getDate()-dias);
      for(;d<=fin;d.setDate(d.getDate()+dias)) if(d>=ini) F.push(iso(d));
    } else if(nx.slice(0,7)===ym) F.push(nx);
    var tol=Math.min(3,Math.floor((dias||30)/2));
    F.forEach(function(fe){
      var hecho=R.some(function(r){ return Math.abs((new Date(r.fecha+'T12:00:00')-new Date(fe+'T12:00:00'))/864e5)<=tol; });
      if(!hecho) ev.push({ site:s.clienteId, name:s.nombre, date:fe, status:fe<S.hoy?'sinregistro':'estimada' });
    });
  });
  return ev.sort(function(a,b){ return a.date.localeCompare(b.date)||a.name.localeCompare(b.name); });
}

}

  if((V==='seguimiento'||V==='inicio')&&S.sedes[0]&&SEG!==S.sedes[0].clienteId&&window.sgActualizar){ SEG=S.sedes[0].clienteId; setTimeout(sgActualizar,0); }
  try{
    var m=$('main'); if(!m||m.querySelector('.sd53')) return;
    var top=m.querySelector('.in-top')||m.querySelector('h1'); if(!top) return;
    var bj=top.nextElementSibling&&top.nextElementSibling.classList.contains('bajada')?top.nextElementSibling:top;
    var h='<div class="sd53" role="group" aria-label="Sede"><span>Sede:</span>'+(porSede?'':'<button type="button" class="'+(!s?'on':'')+'" onclick="sede53(\'\')">Todas</button>')+
      FULL.sedes.map(function(x){ return '<button type="button" class="'+(s&&s.clienteId===x.clienteId?'on':'')+'" onclick="sede53(\''+esc(x.clienteId)+'\')">'+esc(nom(x))+'</button>'; }).join('')+
      (porSede?'<small>Esta pantalla se ve por sede.</small>':'')+'</div>';
    var visto=''; try{ visto=localStorage.getItem('ptl_adm53')||''; }catch(e){}
    if(V==='inicio'&&!VISTA&&visto!==String(FULL.yo.adminEn||'1')) h='<div class="sd53-bien"><span><b>Ya puede administrar sus '+FULL.sedes.length+' sedes</b> desde aquí, con su mismo PIN. Elija abajo cuál quiere ver.</span><button type="button" onclick="sede53Visto()">Entendido</button></div>'+h;
    bj.insertAdjacentHTML('afterend',h);
    if(V==='inicio'){
      var b=m.querySelector('.bajada'); if(b) b.textContent=s?nom(s)+(s.frecuencia?' · Frecuencia '+String(s.frecuencia).toLowerCase():''):'Administradora de '+FULL.sedes.length+' sedes';
      if(!s){ var so=m.querySelector('.so-b'); if(so&&so.parentNode) so.parentNode.removeChild(so); }   /* «Sus servicios» va por sede */
    }
    if(V==='facturas'&&s&&(FULL.facturas||[]).some(function(f){ return !f.sedeId; })) {
      var t=m.querySelector('.sd53'); if(t) t.insertAdjacentHTML('afterend','<p class="qn-n" style="margin:-6px 0 12px">Las facturas a nombre de la cuenta (sin sede) se ven en «Todas».</p>');
    }
  }catch(e){ if(window.console) console.error(e); }
};
})();
</script>
