<style>
:root{
  --navy:#0f2a57; --marca:#14306b; --acento:#F5B301; --tinta:#0f2140; --gris:#667489;
  --fondo:#f3f5f8; --tarjeta:#fff; --linea:#e1e6ee; --suave:#f6f8fb; --azulclaro:#e8effb;
  --ok:#2f9e44; --ok-bg:#eaf6e4; --warn:#a87400; --warn-bg:#fff4d6; --bad:#d64045; --bad-bg:#fdecea; --info:#3b6fd4; --info-bg:#e8effb;

}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--fondo);color:var(--tinta);font:15px/1.5 var(--letra);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* barra con la insignia (opción C) */
.barra{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:calc(8px + var(--sa)) 16px 8px;height:calc(var(--barra) + var(--sa));position:sticky;top:0;z-index:30}
.barra img.l{height:19px;display:block}
.barra .sep{width:1px;height:26px;background:rgba(255,255,255,.22)}
.barra .mod{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.barra .sp{flex:1}
.barra .usr{display:flex;gap:9px;align-items:center;font-size:13px}
.barra .av{width:32px;height:32px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.barra .salir{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:9px;padding:5px 11px;cursor:pointer;font-size:12.5px;font-weight:600;display:flex;gap:6px;align-items:center}
.em-c{border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.em-c img{width:78%;display:block}
.barra .ins{position:absolute;left:34px;top:calc(12px + var(--sa));width:84px;height:84px;box-shadow:0 0 0 4px var(--navy),0 10px 22px rgba(15,33,64,.25)}
.barra .hueco{width:104px;flex:none}
.barra .pc{display:contents}.barra .cel{display:none}
.cuerpo{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - var(--barra))}
.menu{background:#fff;border-right:1px solid var(--linea);padding:34px 10px 14px}
.menu .mi{position:sticky;top:calc(var(--barra) + var(--sa) + 10px)}
.menu h6{margin:12px 10px 6px;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--gris)}
.menu button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;background:none;border:0;border-radius:9px;padding:9px 10px;cursor:pointer;color:var(--tinta);font-size:14px;font-weight:600}
.menu button svg{color:#8592a6;flex:none}
.menu button:hover{background:var(--suave)}
.menu button[aria-current="page"]{background:var(--azulclaro);color:var(--marca)}
.menu button[aria-current="page"] svg{color:var(--marca)}
.menu button[disabled]{opacity:.45;cursor:not-allowed}
.nb{margin-left:auto;background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;font-weight:700}
.tabs{display:none}
.main{padding:22px 26px 40px;min-width:0;max-width:1100px}
.main h1{font-size:22px;margin:0 0 2px;color:var(--marca);text-wrap:balance}
.main .bajada{color:var(--gris);margin:0 0 16px}
@media (max-width:820px){
  .barra .pc{display:none}.barra .cel{display:flex}
  .barra .ins{left:50%;transform:translateX(-50%);top:calc(14px + var(--sa));width:64px;height:64px}
  .cuerpo{grid-template-columns:minmax(0,1fr)}
  .menu{display:none}
  /* pestañas de ancho fijo, solo la raya de abajo (opción B) */
  .tabs{display:flex;position:sticky;top:calc(var(--barra) + var(--sa));z-index:25;background:#fff;border-bottom:1px solid var(--linea);overflow-x:auto;scrollbar-width:none;padding-top:16px}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:0 0 96px;background:none;border:0;padding:12px 4px 10px;font-size:13.5px;font-weight:600;color:#6b778b;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;position:relative}
  .tabs button[aria-current="page"]{color:var(--marca);border-bottom-color:var(--marca)}
  .tabs button[disabled]{opacity:.45}
  .tabs .nb{position:absolute;top:6px;right:8px;margin:0}
  .main{padding:16px 14px 28px}
}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-ini{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
@media (max-width:820px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-ini{grid-template-columns:minmax(0,1fr)}}

.card{background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--radio);padding:16px 18px;min-width:0}

.kpi b{display:block;font-size:26px;line-height:1.15;color:var(--tinta);font-variant-numeric:tabular-nums}

.t-ok{background:var(--ok-bg);color:var(--ok)}.t-warn{background:var(--warn-bg);color:var(--warn)}.t-bad{background:var(--bad-bg);color:var(--bad)}.t-info{background:var(--info-bg);color:var(--info)}.t-gris{background:#eef1f5;color:var(--gris)}
.btn{display:inline-flex;gap:7px;align-items:center;justify-content:center;background:#fff;border:1px solid #cdd5e1;color:var(--marca);border-radius:var(--radio-b);padding:8px 14px;font-weight:600;cursor:pointer;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--suave)}.btn.pri{background:var(--marca);border-color:var(--marca);color:#fff}.btn.sm{padding:5px 10px;font-size:13px}.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.verde{background:var(--verde-b);border-color:var(--verde-b);color:#fff}.btn.gr{padding:12px 18px;font-size:15.5px;border-radius:12px}

.fila{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid #eef1f5}

.fecha{flex:none;width:50px;text-align:center;border:1px solid var(--linea);border-radius:10px;padding:4px 0;line-height:1.1}

.tabla{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}

td{border-bottom:1px solid #eef1f5;padding:10px 8px;vertical-align:middle}

.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.aviso{display:flex;gap:12px;align-items:flex-start;border-radius:12px;padding:12px 14px;margin:0 0 16px}
.aviso .tx{flex:1}.aviso.warn{background:var(--warn-bg);color:#5c4200}.aviso.bad{background:var(--bad-bg);color:#7d1d16}.aviso.info{background:var(--info-bg);color:#1f3f86}.aviso.ok{background:var(--ok-bg);color:#1d5e22}
.aviso .acc{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pista{background:var(--suave);border:1px dashed #cfd7e3;border-radius:10px;padding:9px 12px;color:var(--gris);font-size:13px}
.campo{display:grid;gap:5px;margin-bottom:12px}.campo label,.campo .lb{font-size:12.5px;font-weight:700;color:var(--gris)}
.campo input,.campo select,.campo textarea{border:1px solid #cdd5e1;border-radius:var(--radio-b);padding:9px 11px;background:#fff;width:100%}
.ent{max-width:420px;margin:0 auto;padding:34px 16px}
.ent .card{text-align:center;padding:26px 22px}
.ent .eco-lg{margin:0 auto;box-shadow:0 0 0 1px var(--linea),0 8px 24px rgba(15,33,64,.1)}

.cg-a{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:0 24px;text-align:center}
.cg-a p{margin:0;color:var(--gris);font-size:15px}.cg-a b{display:block;color:var(--marca);font-size:18px;margin-bottom:4px}
.cg-a .eco-lg{margin:0 auto;box-shadow:0 0 0 1px var(--linea),0 10px 30px rgba(15,33,64,.12)}
.eco-desp #eco-cortina .eco-lg{transition:width .7s cubic-bezier(.3,.8,.3,1),height .7s cubic-bezier(.3,.8,.3,1),transform .7s cubic-bezier(.3,.8,.3,1),box-shadow .7s}
.eco-desp #eco-cortina .eco-lg.quieto{transition:none}
.dv-f{position:fixed;inset:0;z-index:58;background:var(--fondo);display:flex;flex-direction:column;animation:fd .15s}
.dv-h{background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:calc(8px + var(--sa)) 12px 8px;min-height:56px;flex:none}

.dv-h .t{flex:1;min-width:0;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dv-h .ab{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:9px;padding:6px 10px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.dv-b{position:relative;flex:1}.dv-b iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.dv-b .cg-a{position:absolute;inset:0;min-height:0}
.cg-a .em-c{width:110px;height:110px;box-shadow:0 0 0 1px var(--linea),0 10px 30px rgba(15,33,64,.12)}
.ent h2{margin:12px 0 4px;color:var(--marca);font-size:20px}
.pts{display:flex;gap:9px;justify-content:center;margin:16px 0}
.pts i{width:16px;height:16px;border-radius:50%;border:2px solid #b8c2d2}.pts i.on{background:var(--marca);border-color:var(--marca)}
.tec{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:270px;margin:0 auto}
.tec button{height:52px;border-radius:12px;border:1px solid var(--linea);background:#fff;font-size:20px;font-weight:600;cursor:pointer}

.msg{min-height:20px;color:var(--bad);font-size:13.5px;margin-top:8px}
.fondo{position:fixed;inset:0;background:rgba(15,33,64,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto}

.modal h2{margin:0 0 4px;font-size:18px;color:var(--marca)}.modal .pie{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0f2140;color:#fff;border-radius:10px;padding:10px 16px;font-size:14px;display:none;z-index:60;max-width:90vw;text-align:center}
.pie-p{padding:20px 16px 28px;text-align:center;font-size:11.5px;color:#6a7689;line-height:1.6}
/* hoja para instalar (opción B) */
.hoja-f{position:fixed;inset:0;background:rgba(15,33,64,.5);display:flex;align-items:flex-end;justify-content:center;z-index:55;animation:fd .2s ease}

@keyframes fd{from{opacity:0}to{opacity:1}}
.ico{position:relative;display:grid;place-items:center;overflow:hidden;flex:none;margin:0 auto}

.sv-dest .tx{padding:16px 18px}
.sv-sub{font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--gris);font-weight:700;margin:4px 0 10px}
.sv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;scroll-margin-top:140px}
.sv-card{background:#fff;border:1px solid var(--linea);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.sv-card:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(15,33,64,.10)}
.sv-card .il{height:118px;display:grid;place-items:center;padding:8px}
.sv-card .il img{max-height:102px;max-width:90%}
.sv-card .tx{padding:12px 14px 14px;display:flex;flex-direction:column;gap:5px;flex:1}
.sv-card b{font-size:15px;line-height:1.25}
.sv-card small{color:var(--gris);font-size:12.8px;flex:1;line-height:1.4}
.sv-card .btn{margin-top:6px;align-self:flex-start}
.sv-tiene{display:flex;gap:10px;align-items:center;background:var(--ok-bg);color:#1d5e22;border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:13.5px}
.sv-tiene svg{flex:none}
.sv-list{margin-top:16px}
.sv-list .row{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid #eef1f5}
.sv-list .row:first-of-type{border-top:0}
.sv-list .row .tx{flex:1;min-width:0}
.sv-list .row .tx b{display:block;font-size:14.5px}
.sv-list .row .tx small{display:block;color:var(--gris);font-size:12.5px;line-height:1.35}
@media (max-width:620px){.sv-hero h2{font-size:20px}.sv-dest{grid-template-columns:minmax(0,1fr)}.sv-dest .il{height:130px}.sv-dest .il img{max-height:110px}}
/* facturas y pagos (v11) */
.fx-cab{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:18px;align-items:center;margin-bottom:18px}
.fx-cab.atr{border-color:#f2d3d4;background:#fffbfb}

.fx.venc{border-color:#f2c4c6;background:#fffbfb}
.fx-a{display:flex;justify-content:space-between;align-items:center;gap:10px}

.fx-n{font-size:12.5px;color:var(--gris)}

.fx-b b{font-size:19px;color:var(--tinta);font-variant-numeric:tabular-nums}
.fx.pag .fx-b b{color:var(--gris);font-size:16px}
.fx-b small{font-size:12.5px;color:var(--gris)}.fx-b small.r{color:var(--bad);font-weight:700}

.fx-op span{flex:1;min-width:0}.fx-op span b{display:block;font-size:14px;color:#0f2140}.fx-op span small{color:#667489;font-size:12px}
.fx-op em{font-style:normal;font-weight:800;color:#0f2140;font-variant-numeric:tabular-nums}
.cp-l .fila .tx small.mot{color:var(--bad)}
@media (max-width:820px){
  .fx-cab{grid-template-columns:minmax(0,1fr);gap:12px}
  .fx-lista{display:grid}.fx-tabla{display:none}
  .fx-bot .btn{flex:1 1 100%;justify-content:center}
}

<body>
<div id="app"><div id="espera" style="position:fixed;inset:0;background:#0f2a57"></div></div>
<div id="toast"></div>
<script>
/* ═══ utilidades ═══ */
/* en clientes.ecovsaapp.com los documentos (recibo, certificados) se abren desde ecovsaapp.com */
var DOCS = /^clientes\./.test(location.hostname) ? 'https://ecovsaapp.com/' : '';
function doc(u){ return /^https?:/.test(u||'') ? u : DOCS + (u||''); }
var S = null, SES = '', V = 'inicio', PIN = '', PIN1 = '', ESTADO = '', INV = '', CLI = '', COD = '', HOJA_YA = false, RECIEN = false;
var MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'], MESL = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var EMB = 'ecovsa-emblema.png';
function $(i){ return document.getElementById(i); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function q(k){ var m=(location.search||'').match(new RegExp('[?&]'+k+'=([^&]+)')); return m?decodeURIComponent(m[1]):''; }
function f(i){ var d=new Date(String(i)+'T12:00:00'); return isNaN(d)?String(i||''):d.getDate()+' '+MES[d.getMonth()]+' '+d.getFullYear(); }
function fl(i){ var d=new Date(String(i)+'T12:00:00'); return isNaN(d)?String(i||''):d.getDate()+' de '+MESL[d.getMonth()]+' de '+d.getFullYear(); }
function mesDe(i){ var d=new Date(String(i)+'T12:00:00'); if(isNaN(d)) return ''; var m=MESL[d.getMonth()]; return m.charAt(0).toUpperCase()+m.slice(1)+' '+d.getFullYear(); }
function kg(v){ return (Math.round((Number(v)||0)*100)/100).toLocaleString('es-PA'); }
function B(v){ return 'B/. '+(Number(v)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
/* el número de Sage se guarda y se envía completo; al cliente solo se le quitan los ceros de la izquierda */
function nFac(n){ return String(n==null?'':n).replace(/^0+(?=\d)/,''); }
function toast(t){ var a=$('toast'); a.textContent=t; a.style.display='block'; clearTimeout(a._t); a._t=setTimeout(function(){ a.style.display='none'; },4000); }
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k)||''; if(v) localStorage.setItem(k,v); else localStorage.removeItem(k); }catch(e){ return ''; } }
function llamar(fn){ var a=[].slice.call(arguments,1); return new Promise(function(ok,no){ var r=google.script.run.withSuccessHandler(ok).withFailureHandler(no); r[fn].apply(r,a); }); }
function logo(px,arma){ return window.ECOCARGA?ECOCARGA.logo(px||76,{arma:!!arma}):'<img src="logo-ecovsa.png" alt="ECOVSA" style="width:'+(px||76)+'px">'; }
function cerrarModal(){ var m=$('fondo'); if(m) m.remove(); }
function modal(h){ cerrarModal(); var d=document.createElement('div'); d.className='fondo'; d.id='fondo'; d.innerHTML='<div class="modal" role="dialog" aria-modal="true">'+h+'</div>'; d.onclick=function(e){ if(e.target===d) cerrarModal(); }; document.body.appendChild(d); }
function ocupado(b,si,t){ if(!b) return; if(si){ b._t=b.innerHTML; b.disabled=true; b.textContent=t||'Enviando…'; } else { b.disabled=false; if(b._t) b.innerHTML=b._t; } }
function chips(id,ops,sel){ return '<div class="ll-chips" id="'+id+'" role="radiogroup">'+ops.map(function(o){ return '<button type="button" role="radio" data-c="'+o[0]+'" class="'+(o[0]===sel?'on':'')+'" aria-checked="'+(o[0]===sel)+'">'+o[1]+'</button>'; }).join('')+'</div>'; }
function chipsActivar(id){ var c=$(id); if(!c) return; c.onclick=function(e){ var b=e.target.closest('button[data-c]'); if(!b) return; c.querySelectorAll('button').forEach(function(x){ x.classList.remove('on'); x.setAttribute('aria-checked','false'); }); b.classList.add('on'); b.setAttribute('aria-checked','true'); }; }
function chipSel(id){ var b=$(id)&&$(id).querySelector('button.on'); return b?b.getAttribute('data-c'):''; }

/* íconos de línea */
var ICP = {
  casa:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
  camion:'<path d="M2 6h11v10H2z"/><path d="M13 9h5l3 4v3h-8z"/><circle cx="6" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>',
  cert:'<rect x="4" y="3" width="16" height="13" rx="2"/><circle cx="12" cy="17" r="3"/><path d="M10.5 19.5L10 22l2-1 2 1-.5-2.5"/><path d="M8 7h8M8 10h5"/>',
  pago:'<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 9.5h19M6 15h4"/>',
  bolsa:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 016 0v2"/>',
  lista:'<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>',
  salir:'<path d="M15 4h4v16h-4"/><path d="M10 8l-4 4 4 4M6 12h10"/>',
  descarga:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  der:'<path d="M9 6l6 6-6 6"/>',
  basura:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  instalar:'<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M12 7v7M9 11l3 3 3-3"/>',
  ok:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  flechaIzq:'<path d="M15 6l-6 6 6 6"/>',
  chat:'<path d="M4 5h16v11H9l-5 4z"/>',
  sedes:'<path d="M3 21V8l6-4 6 4v13"/><path d="M15 21V11h6v10M7 10h4M7 14h4M7 18h4"/>',
  equipo:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.2c3 .2 5.5 2.4 5.5 5.8"/>'
};
function ic(n,s){ s=s||18; return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICP[n]||'')+'</svg>'; }
function emC(px,ins){ return '<span class="em-c'+(ins?' ins':'')+'"'+(ins?'':' style="width:'+px+'px;height:'+px+'px"')+'><img src="'+EMB+'" alt="ECOVSA"></span>'; }
function icono(px){ return '<span class="ico iA" style="width:'+px+'px;height:'+px+'px;border-radius:'+Math.round(px*.225)+'px"><span class="c"><img src="'+EMB+'" alt=""></span></span>'; }
/* dibujos de los productos (fotos sin fondo) */
var IMG = { bolsas:'ptl-bolsas.png', punzo:'ptl-punzo.png', pedal:'ptl-pedal.png', fumiga:'ptl-fumiga.png', solidos:'ptl-solidos.png', lleno:'ptl-lleno.png' };
function ilu(k,alt){ return '<img src="'+IMG[k]+'" alt="'+esc(alt||'')+'" loading="lazy">'; }

/* ═══ entrada ═══ */
function pantallaPin(titulo, sub, extra){
  $('app').innerHTML='<div class="ent"><div class="card">'+logo(76,true)+'<h2>'+titulo+'</h2><p style="color:var(--gris);margin:0">'+sub+'</p><div class="pts" id="pts"></div>'+
    '<div class="tec" id="tec">'+['1','2','3','4','5','6','7','8','9','','0','⌫'].map(function(x){ return x===''?'<span></span>':'<button type="button" data-k="'+x+'" aria-label="'+(x==='⌫'?'Borrar':x)+'">'+x+'</button>'; }).join('')+'</div>'+
    '<div class="msg" id="msg"></div>'+(extra||'')+'</div></div>';
  PIN=''; pts();
  $('tec').onclick=function(e){ var b=e.target.closest('button'); if(!b) return; var k=b.getAttribute('data-k'); if(k==='⌫') PIN=PIN.slice(0,-1); else if(PIN.length<6) PIN+=k; pts(); if(PIN.length===6) setTimeout(alPin,120); };
}
document.addEventListener('keydown',function(e){ if(!$('tec')) return; if(/^\d$/.test(e.key)&&PIN.length<6){ PIN+=e.key; pts(); if(PIN.length===6) setTimeout(alPin,120); } else if(e.key==='Backspace'){ PIN=PIN.slice(0,-1); pts(); } });
function pts(){ var p=$('pts'); if(p){ var h=''; for(var i=0;i<6;i++) h+='<i class="'+(i<PIN.length?'on':'')+'"></i>'; p.innerHTML=h; } }
var alPin=function(){};
function entrar(){
  ESTADO='entrar';
  pantallaPin('Entrar a su portal','Escriba su PIN de 6 números.',
    '<p style="margin:16px 0 0;font-size:13.5px">'+(CLI?'<a href="?cli='+encodeURIComponent(CLI)+'&cod='+encodeURIComponent(COD)+'&p=activar">¿Primera vez? Activar mi acceso</a> · <a href="?cli='+encodeURIComponent(CLI)+'&cod='+encodeURIComponent(COD)+'&p=olvide">Olvidé mi PIN</a>':'¿Primera vez u olvidó su PIN? Escanee el QR del distintivo de su establecimiento o escríbanos al WhatsApp <b>6264-1647</b>.')+'</p>');
  alPin=function(){ var m=$('msg'); m.style.color='var(--gris)'; m.textContent='Revisando…';
    llamar('api_ptlEntrar',PIN).then(function(r){ if(!r||!r.ok){ m.style.color=''; m.textContent=(r&&r.error)||'No se pudo entrar.'; PIN=''; pts(); return; } SES=r.sesion; ls('ptl_ses',SES); cargar(); },
      function(){ m.style.color=''; m.textContent='Sin conexión. Intente de nuevo.'; PIN=''; pts(); }); };
}
function invitacion(){
  llamar('api_ptlInvitacion',INV).then(function(r){
    if(!r||!r.ok){ $('app').innerHTML='<div class="ent"><div class="card">'+logo(76)+'<h2>Invitación no válida</h2><p style="color:var(--gris)">'+esc((r&&r.error)||'')+'</p><a class="btn pri" href="Portal.html">Entrar con mi PIN</a></div></div>'; return; }
    var de=r.nivel==='corp'?'<b>'+esc(r.de)+'</b> (todas las sedes)':'<b>'+esc(r.de)+'</b>';
    var crear=function(){ pantallaPin('Bienvenido, '+esc(String(r.nombre).split(' ')[0]),'ECOVSA le da acceso al portal de '+de+'.<br><b style="color:var(--tinta)">Cree su PIN de 6 números.</b>','<p class="pista" style="margin-top:14px">No use su fecha de nacimiento ni números seguidos. Es solo suyo: no lo comparta.</p>');
      alPin=function(){ PIN1=PIN; pantallaPin('Repita su PIN','Escríbalo otra vez para confirmarlo.'); alPin=function(){
        var m=$('msg'); m.style.color='var(--gris)'; m.textContent='Guardando…';
        llamar('api_ptlCrearPin',INV,PIN1,PIN).then(function(x){ if(!x||!x.ok){ toast((x&&x.error)||'No se pudo'); crear(); setTimeout(function(){ var mm=$('msg'); if(mm) mm.textContent=(x&&x.error)||''; },50); return; }
          /* 3.18: en vez de la pantalla «Tenga ECOVSA en su celular», entra al portal y sale la hoja para instalar */
          SES=x.sesion; ls('ptl_ses',SES); history.replaceState(null,'','Portal.html'); RECIEN=true; toast('✓ PIN creado'); cargar(); }, function(){ m.style.color=''; m.textContent='Sin conexión. Intente de nuevo.'; }); }; }; };
    crear();
  },function(){ toast('Sin conexión'); });
}
function pedirAcceso(tipo){
  var olv=tipo==='olvide';
  $('app').innerHTML='<div class="ent"><div class="card" style="text-align:left">'+'<div style="text-align:center">'+logo(70,true)+'</div><h2 style="text-align:center">'+(olv?'Olvidé mi PIN':'Activar mi acceso')+'</h2>'+
    '<p style="color:var(--gris);margin:0 0 14px;text-align:center">'+(olv?'Pida un PIN nuevo. ':'Pida su acceso al portal de este establecimiento. ')+'Por seguridad, ECOVSA le manda la invitación al WhatsApp registrado del establecimiento.</p>'+
    '<div class="campo"><label for="pa-n">Su nombre</label><input id="pa-n" autocomplete="name"></div><div class="campo"><label for="pa-c">Su cargo</label><input id="pa-c" placeholder="Ej. Administradora"></div>'+
    '<div class="campo"><label for="pa-o">Nota (opcional)</label><input id="pa-o"></div><button class="btn pri" style="width:100%" id="pa-b" type="button">Enviar el pedido</button><div class="msg" id="msg"></div>'+
    '<p style="text-align:center;margin:14px 0 0;font-size:13.5px"><a href="Portal.html'+(CLI?'?cli='+encodeURIComponent(CLI)+'&cod='+encodeURIComponent(COD):'')+'">Ya tengo mi PIN</a></p></div></div>';
  $('pa-b').onclick=function(){ var b=this; ocupado(b,true);
    llamar('api_ptlPedirAcceso',CLI,COD,{tipo:olv?'olvide':'activar',nombre:$('pa-n').value,cargo:$('pa-c').value,nota:$('pa-o').value}).then(function(r){ ocupado(b,false);
      if(!r||!r.ok){ $('msg').textContent=(r&&r.error)||'No se pudo'; return; }
      $('app').innerHTML='<div class="ent"><div class="card">'+logo(70)+'<h2>Pedido recibido</h2><p style="color:var(--gris)">'+esc(r.mensaje||'')+'</p>'+(r.folio?'<span class="tag t-info">'+esc(r.folio)+'</span>':'')+'</div></div>'; },
      function(){ ocupado(b,false); $('msg').textContent='Sin conexión. Intente de nuevo.'; }); };
}

/* ═══ instalar en el celular (hoja de abajo, opción B) ═══ */
var EV_INST=null; window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); EV_INST=e; });
function instalada(){ try{ return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true; }catch(e){ return false; } }
function esCel(){ try{ return matchMedia('(max-width: 820px)').matches||/android|iphone|ipad|ipod/i.test(navigator.userAgent); }catch(e){ return false; } }
function tocaHoja(){
  if(HOJA_YA||instalada()||!esCel()) return false;
  if(RECIEN) return true;
  var no=Number(ls('ptl_ins_no'))||0; return Date.now()-no>7*864e5;
}
function hojaIns(){
  HOJA_YA=true;
  var nom=nivel()==='corp'?S.yo.razonSocial:(S.sedes[0]||{}).nombre, pago=nivel()!=='sede';
  var d=document.createElement('div'); d.className='hoja-f'; d.id='hojaI'; d.onclick=function(e){ if(e.target===d) ahoraNo(); };
  d.innerHTML='<div class="hoja" role="dialog" aria-modal="true" aria-labelledby="hj-t"><div class="asa"></div>'+icono(76)+
    '<h2 id="hj-t">Cuando llegue el inspector, lo tiene todo en su mano</h2><p>Su certificado y sus recibos de '+esc(nom)+', listos en su celular. Sin buscar papeles.</p>'+
    '<ul class="ins-ben"><li><span class="bi">'+ic('cert',20)+'</span><span><b>Certificado y recibos al instante</b><small>Para mostrar al MINSA o a su auditor, en un toque.</small></span></li>'+
    '<li><span class="bi">'+ic('camion',20)+'</span><span><b>Su próxima visita a la vista</b><small>Sepa qué día pasamos por su local.</small></span></li>'+
    '<li><span class="bi">'+ic('basura',20)+'</span><span><b>¿Se llenó su depósito? Un toque</b><small>Le decimos al momento si va dentro de su plan.</small></span></li>'+
    (pago?'<li><span class="bi">'+ic('pago',20)+'</span><span><b>Pague sin llamar</b><small>Vea su saldo y suba su comprobante desde ahí.</small></span></li>':'')+'</ul>'+
    '<div id="hj-p"></div><button class="btn pri gr" style="width:100%" type="button" id="hj-b">'+ic('instalar',18)+'Agregar ECOVSA a mi celular</button>'+
    '<p class="ins-pie">Gratis · no ocupa espacio · entra con su mismo PIN</p>'+

function vSolicitudes(){
  var P=S.pedidos;
  return titulo('Solicitudes','Lo que ha pedido a ECOVSA y en qué va')+'<div class="card">'+(P.length?P.map(function(p){ return '<div class="fila"><div class="tx"><b>'+esc(p.resumen||p.tipo)+'</b><small>'+(p.sede?esc(p.sede)+' · ':'')+esc(p.folio||'')+(p.fecha?' · '+f(p.fecha):'')+'</small></div><span class="tag '+(p.cerrada?'t-ok':'t-info')+'">'+esc(p.estado)+'</span></div>'; }).join(''):'<p style="color:var(--gris);margin:0">No tiene solicitudes.</p>')+'</div>';
}
function vEquipo(){
  var E=S.equipo;
  return titulo('Accesos de su equipo','Quién de su empresa entra al portal. Usted pide los accesos y las bajas; ECOVSA los aprueba.')+
    '<div style="margin-bottom:12px"><button class="btn pri" onclick="pedirPersona()">Pedir un acceso</button></div><div class="card">'+(E.length?E.map(function(p){ return '<div class="fila"><div class="tx"><b>'+esc(p.nombre)+'</b><small>'+esc(p.cargo||'')+(p.sede?' · '+esc(p.sede):' · toda la cuenta')+(p.ultimoIngreso?' · entró el '+esc(p.ultimoIngreso.slice(0,10)):'')+'</small></div><span class="tag '+(p.estado==='activo'?'t-ok':'t-info')+'">'+(p.estado==='activo'?'Activo':'Invitado')+'</span>'+(p.nombre!==S.yo.nombre?'<button class="btn sm" onclick="pedirBaja(\''+esc(p.accesoId)+'\',\''+esc(p.nombre)+'\')">Quitar</button>':'')+'</div>'; }).join(''):'<p style="color:var(--gris);margin:0">Solo usted tiene acceso por ahora.</p>')+'</div>';
}
function pedirPersona(){
  modal('<h2>Pedir un acceso</h2><p style="color:var(--gris);margin:0 0 12px">Para el encargado de una sede. ECOVSA le manda la invitación por WhatsApp.</p>'+selSede('pp-s')+
    '<div class="campo"><label for="pp-n">Nombre</label><input id="pp-n"></div><div class="campo"><label for="pp-c">Cargo</label><input id="pp-c"></div><div class="campo"><label for="pp-t">Celular (WhatsApp)</label><input id="pp-t" inputmode="tel"></div>'+
    '<div class="pie"><button class="btn" onclick="cerrarModal()">Cancelar</button><button class="btn pri" id="pp-b">Enviar pedido</button></div>');
  $('pp-b').onclick=function(){ var b=this; ocupado(b,true); llamar('api_ptlPedirEquipo',SES,{tipo:'alta',clienteId:$('pp-s').value,nombre:$('pp-n').value,cargo:$('pp-c').value,telefono:$('pp-t').value}).then(function(r){ ocupado(b,false); if(!r||!r.ok){ toast((r&&r.error)||'No se pudo'); return; } cerrarModal(); toast('Pedido enviado: ECOVSA lo aprueba'); },function(){ ocupado(b,false); toast('Sin conexión'); }); };
}
function pedirBaja(id,nom){
  modal('<h2>Quitar el acceso de '+esc(nom)+'</h2><p style="color:var(--gris)">ECOVSA lo quita al aprobar su pedido.</p><div class="pie"><button class="btn" onclick="cerrarModal()">Cancelar</button><button class="btn pri" id="pb-b">Pedir la baja</button></div>');
  $('pb-b').onclick=function(){ var b=this; ocupado(b,true); llamar('api_ptlPedirEquipo',SES,{tipo:'baja',accesoId:id}).then(function(r){ ocupado(b,false); if(!r||!r.ok){ toast((r&&r.error)||'No se pudo'); return; } cerrarModal(); toast('Pedido de baja enviado'); },function(){ ocupado(b,false); toast('Sin conexión'); }); };
}

/* ═══ arranque ═══ */
(function(){
  CLI=q('cli'); COD=q('cod'); INV=q('inv'); SES=ls('ptl_ses');
  var p=q('p');
  if(INV){ invitacion(); return; }
  if((p==='activar'||p==='olvide')&&CLI&&COD){ pedirAcceso(p); return; }
  /* 3.18.2 · al abrir sin sesión también sale la entrada completa y debajo queda el PIN */
  if(SES) cargar(); else { entrada(); entrar(); finEntrada(false); }
})();
</script>
